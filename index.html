<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Daily English</title>
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --bg:#EDF0F4;
  --sheet:#FFFFFF;
  --sheet-2:#F5F8FC;
  --sheet-3:#E5EBF3;
  --ink:#111A2B;
  --ink-2:#47536A;
  --ink-3:#7B889E;
  --line:#DAE1EB;
  --line-2:#C4CFDE;
  --accent:#1D3E77;
  --accent-2:#345E9F;
  --accent-soft:#E2EAF7;
  --wrong:#BE3A21;
  --wrong-soft:#FAE6E1;
  --right:#12664C;
  --right-soft:#DDF0E8;
  --amber:#8F630A;
  --amber-soft:#F7EEDA;
  --shadow-1:0 1px 2px rgba(17,26,43,.07);
  --shadow-2:0 1px 2px rgba(17,26,43,.06), 0 10px 26px -14px rgba(17,26,43,.30);

  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Noto Serif","Times New Roman",serif;

  --r-s:6px; --r-m:10px; --r-l:14px;
  --pad:18px;
}

@media (prefers-color-scheme:dark){
  :root{
    --bg:#0B1017;
    --sheet:#141B25;
    --sheet-2:#1A222E;
    --sheet-3:#212B39;
    --ink:#E9EEF5;
    --ink-2:#A0AEC1;
    --ink-3:#6C7B90;
    --line:#232E3C;
    --line-2:#31404F;
    --accent:#7CA6ED;
    --accent-2:#9CBCF3;
    --accent-soft:#182640;
    --wrong:#EE7053;
    --wrong-soft:#2E1A15;
    --right:#4FC79A;
    --right-soft:#102A22;
    --amber:#D9A441;
    --amber-soft:#2A2011;
    --shadow-1:0 1px 2px rgba(0,0,0,.45);
    --shadow-2:0 1px 2px rgba(0,0,0,.45), 0 12px 30px -16px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --bg:#0B1017; --sheet:#141B25; --sheet-2:#1A222E; --sheet-3:#212B39;
  --ink:#E9EEF5; --ink-2:#A0AEC1; --ink-3:#6C7B90;
  --line:#232E3C; --line-2:#31404F;
  --accent:#7CA6ED; --accent-2:#9CBCF3; --accent-soft:#182640;
  --wrong:#EE7053; --wrong-soft:#2E1A15;
  --right:#4FC79A; --right-soft:#102A22;
  --amber:#D9A441; --amber-soft:#2A2011;
  --shadow-1:0 1px 2px rgba(0,0,0,.45);
  --shadow-2:0 1px 2px rgba(0,0,0,.45), 0 12px 30px -16px rgba(0,0,0,.85);
}
:root[data-theme="light"]{
  --bg:#EDF0F4; --sheet:#FFFFFF; --sheet-2:#F5F8FC; --sheet-3:#E5EBF3;
  --ink:#111A2B; --ink-2:#47536A; --ink-3:#7B889E;
  --line:#DAE1EB; --line-2:#C4CFDE;
  --accent:#1D3E77; --accent-2:#345E9F; --accent-soft:#E2EAF7;
  --wrong:#BE3A21; --wrong-soft:#FAE6E1;
  --right:#12664C; --right-soft:#DDF0E8;
  --amber:#8F630A; --amber-soft:#F7EEDA;
  --shadow-1:0 1px 2px rgba(17,26,43,.07);
  --shadow-2:0 1px 2px rgba(17,26,43,.06), 0 10px 26px -14px rgba(17,26,43,.30);
}

/* ============================================================
   BASE
   ============================================================ */
*{box-sizing:border-box}
[hidden]{display:none !important}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:16.5px; line-height:1.5;
  -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
}
button,input,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent-2); outline-offset:2px; border-radius:4px}

.app{
  max-width:33rem; margin:0 auto; min-height:100dvh;
  display:flex; flex-direction:column;
  background:var(--bg);
}

/* --- top bar --- */
.topbar{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; gap:10px;
  padding:10px 14px; min-height:52px;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line);
}
.iconbtn{
  flex:0 0 auto; width:34px; height:34px; display:grid; place-items:center;
  background:none; border:1px solid transparent; border-radius:var(--r-m);
  color:var(--ink-2); cursor:pointer;
}
.iconbtn:hover{background:var(--sheet-3); color:var(--ink)}
.topbar-mid{flex:1 1 auto; min-width:0; display:flex; align-items:baseline; gap:9px}
.daytag{
  flex:0 0 auto; font-size:.68rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
  color:var(--accent); background:var(--accent-soft);
  padding:3px 8px; border-radius:100px; font-variant-numeric:tabular-nums;
}
.topbar-title{
  flex:1 1 auto; min-width:0; font-size:.86rem; font-weight:600; color:var(--ink-2);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.clock{
  flex:0 0 auto; font-size:.78rem; color:var(--ink-3);
  font-variant-numeric:tabular-nums; letter-spacing:.02em;
}

/* --- progress rail --- */
.rail{display:flex; gap:4px; padding:10px 14px 0}
.seg{flex:1 1 0; min-width:0}
.seg-bar{height:3px; border-radius:2px; background:var(--line-2); transition:background .25s}
.seg-label{
  display:block; margin-top:5px; font-size:.56rem; letter-spacing:.03em; text-transform:uppercase;
  color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.seg.done .seg-bar{background:var(--accent)}
.seg.now .seg-bar{background:var(--accent)}
.seg.now .seg-label{color:var(--accent); font-weight:700}

/* --- main --- */
main{flex:1 1 auto; padding:16px 14px 8px; display:flex; flex-direction:column; gap:14px}

/* --- dock --- */
.dock{
  position:sticky; bottom:0; z-index:20;
  display:flex; gap:9px; padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top, var(--bg) 62%, transparent);
}
.dock:empty{display:none}

/* ============================================================
   COMPONENTS
   ============================================================ */
.btn{
  flex:1 1 auto; min-height:50px; padding:12px 16px;
  border:1px solid var(--line-2); border-radius:var(--r-m);
  background:var(--sheet); color:var(--ink);
  font-size:.95rem; font-weight:600; cursor:pointer;
  box-shadow:var(--shadow-1);
  transition:transform .08s ease, background .15s;
}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#FFFFFF}
@media (prefers-color-scheme:dark){ .btn.primary{color:#0B1017} }
:root[data-theme="dark"] .btn.primary{color:#0B1017}
:root[data-theme="light"] .btn.primary{color:#FFFFFF}
.btn.ghost{background:transparent; box-shadow:none; color:var(--ink-2); border-color:var(--line)}
.btn.ok{background:var(--right-soft); border-color:transparent; color:var(--right)}
.btn.no{background:var(--wrong-soft); border-color:transparent; color:var(--wrong)}
.btn[disabled]{opacity:.45; cursor:default}

.card{
  background:var(--sheet); border:1px solid var(--line);
  border-radius:var(--r-l); padding:var(--pad);
  box-shadow:var(--shadow-1);
}
.card.raised{box-shadow:var(--shadow-2)}
/* the "margin rule" of a page — subject cue, used only on English content */
.card.marked{border-left:3px solid var(--accent); border-radius:4px var(--r-l) var(--r-l) 4px}

.label{
  font-size:.64rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); display:block; margin-bottom:9px;
}
.label.accent{color:var(--accent)}
.label.wrong{color:var(--wrong)}
.label.right{color:var(--right)}

h1,h2,h3{margin:0; text-wrap:balance; line-height:1.25}
h1{font-size:1.5rem; font-weight:700; letter-spacing:-.015em}
h2{font-size:1.12rem; font-weight:700; letter-spacing:-.01em}
h3{font-size:.95rem; font-weight:700}
p{margin:0}
.stack{display:flex; flex-direction:column; gap:12px}
.stack.tight{gap:8px}
.muted{color:var(--ink-2); font-size:.9rem}
.small{font-size:.82rem; color:var(--ink-3)}

/* English content is set in serif — that is how you tell target language from scaffolding */
.en{font-family:var(--serif); font-size:1.16rem; line-height:1.55; color:var(--ink)}
.en.big{font-size:1.28rem}
.de{font-family:var(--sans)}

/* proofreader marks */
.strike{color:var(--wrong); text-decoration:line-through; text-decoration-thickness:2px}
.ins{color:var(--right); font-weight:600}

/* ============================================================
   WORD CHIPS (fix-it)
   ============================================================ */
.words{display:flex; flex-wrap:wrap; gap:5px 3px; font-family:var(--serif)}
.w{
  font-family:var(--serif); font-size:1.16rem; line-height:1.3;
  padding:6px 5px; border:1px solid transparent; border-radius:var(--r-s);
  background:none; cursor:pointer; color:var(--ink);
  border-bottom:2px dotted var(--line-2);
}
.w:hover{background:var(--sheet-3)}
.w.sel{background:var(--accent-soft); border-color:var(--accent); border-bottom-style:solid; color:var(--accent); font-weight:600}
/* the actual error in the sentence — proofreader's strike */
.w.miss{background:var(--wrong-soft); border-color:var(--wrong); color:var(--wrong); text-decoration:line-through; text-decoration-thickness:2px}
/* you found it */
.w.found::after{content:"✓"; margin-left:5px; color:var(--right); font-weight:700; font-family:var(--sans); font-size:.72em; text-decoration:none; display:inline-block}
/* where you pointed instead — not an error, just your guess */
.w.picked{background:var(--sheet-3); border-color:var(--line-2); border-style:dashed; border-bottom-style:dashed; color:var(--ink-3)}
.w.locked{cursor:default; border-bottom-color:transparent}
.w.locked:hover{background:none}
.w.locked.miss:hover{background:var(--wrong-soft)}
.w.locked.picked:hover{background:var(--sheet-3)}

/* ============================================================
   FORMS
   ============================================================ */
textarea{
  width:100%; background:var(--sheet-2); color:var(--ink);
  border:1px solid var(--line-2); border-radius:var(--r-m);
  padding:12px 13px; resize:vertical;
  font-family:var(--serif); font-size:1.08rem; line-height:1.6;
}
textarea::placeholder{font-family:var(--sans); font-size:.92rem; color:var(--ink-3)}
textarea:focus{border-color:var(--accent); outline:none; background:var(--sheet)}
input.answer{
  width:100%; background:var(--sheet-2); color:var(--ink);
  border:1px solid var(--line-2); border-radius:var(--r-m);
  padding:12px 13px; min-height:50px;
  font-family:var(--serif); font-size:1.08rem;
}
input.answer::placeholder{font-family:var(--sans); font-size:.92rem; color:var(--ink-3)}
input.answer:focus{border-color:var(--accent); outline:none; background:var(--sheet)}
.gap{display:inline-block; min-width:4.5em; border-bottom:2px solid var(--accent); height:1.1em; vertical-align:baseline}
.results{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px}
.results li{display:flex; gap:10px; align-items:flex-start; font-size:.9rem; color:var(--ink-2)}
.results li b{flex:0 0 auto; width:1.2em; text-align:center}
.results li.hit b{color:var(--right)}
.results li.miss b{color:var(--wrong)}
.results li small{display:block; color:var(--ink-3); font-size:.78rem}

.meterrow{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:9px}
.meter{flex:1 1 auto; height:4px; background:var(--sheet-3); border-radius:2px; overflow:hidden}
.meter > i{display:block; height:100%; background:var(--accent); width:0; transition:width .3s}
.count{font-size:.75rem; color:var(--ink-3); font-variant-numeric:tabular-nums; white-space:nowrap}
.count strong{color:var(--ink); font-weight:700}

/* ============================================================
   LISTS / PHRASES
   ============================================================ */
.phrases{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px}
.phrases li{
  display:flex; gap:9px; font-family:var(--serif); font-size:1rem; line-height:1.45;
  padding-bottom:7px; border-bottom:1px solid var(--line);
}
.phrases li:last-child{border-bottom:none; padding-bottom:0}
.phrases li em{
  flex:0 0 auto; font-family:var(--sans); font-style:normal; font-size:.72rem;
  color:var(--ink-3); align-self:flex-start; padding-top:3px; width:2ch;
  font-variant-numeric:tabular-nums;
}
.checks{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px}
.checks li{display:flex; gap:10px; align-items:flex-start; font-size:.88rem; color:var(--ink-2)}
.checks li::before{
  content:""; flex:0 0 auto; width:7px; height:7px; margin-top:7px;
  border-radius:2px; background:var(--accent); opacity:.55;
}

/* ============================================================
   HOME / STATS
   ============================================================ */
.hero{
  background:var(--sheet); border:1px solid var(--line); border-radius:var(--r-l);
  padding:22px var(--pad); box-shadow:var(--shadow-2);
  display:flex; flex-direction:column; gap:14px;
}
.streakrow{display:flex; gap:8px; align-items:stretch}
.stat{
  flex:1 1 0; background:var(--sheet-2); border:1px solid var(--line);
  border-radius:var(--r-m); padding:11px 12px; min-width:0;
}
.stat b{display:block; font-size:1.4rem; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums; line-height:1.1}
.stat span{display:block; margin-top:2px; font-size:.66rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3)}
.stat.hot b{color:var(--amber)}
.stat.hot{background:var(--amber-soft); border-color:transparent}

.rowlink{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  width:100%; text-align:left; padding:13px 15px;
  background:var(--sheet); border:1px solid var(--line); border-radius:var(--r-m);
  cursor:pointer; color:var(--ink); font-size:.92rem; font-weight:600;
}
.rowlink:hover{background:var(--sheet-2)}
.rowlink .chev{color:var(--ink-3); font-size:1.1rem; line-height:1}
.rowlink .sub{display:block; font-size:.76rem; font-weight:400; color:var(--ink-3); margin-top:1px}

/* topic index */
.topics{display:flex; flex-direction:column; gap:6px}
.topic{
  display:flex; gap:11px; align-items:flex-start; width:100%; text-align:left;
  padding:11px 13px; background:var(--sheet); border:1px solid var(--line);
  border-radius:var(--r-m); cursor:pointer; color:var(--ink);
}
.topic:hover{background:var(--sheet-2)}
.topic .tt{flex:1 1 auto; min-width:0; font-size:.9rem; font-weight:600; line-height:1.35}
.topic .tt small{display:block; font-weight:400; font-size:.75rem; color:var(--ink-3); margin-top:1px}
/* wie gut das Thema sitzt — nicht wann es dran war */
.topic .str{
  flex:0 0 auto; align-self:center; font-size:.68rem; font-weight:700;
  font-variant-numeric:tabular-nums; padding:4px 9px; border-radius:100px;
  background:var(--sheet-3); color:var(--ink-3); white-space:nowrap;
}
.topic .str.good{background:var(--right-soft); color:var(--right)}
.topic .str.mid{background:var(--amber-soft); color:var(--amber)}
.topic .str.low{background:var(--wrong-soft); color:var(--wrong)}
.topic.cur{border-color:var(--accent); background:var(--accent-soft)}
.topic.cur .tt{color:var(--accent)}
.blockhead{
  font-size:.64rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); padding:14px 2px 4px;
}

/* archive */
.entry{background:var(--sheet); border:1px solid var(--line); border-radius:var(--r-m); overflow:hidden}
.entry > summary{
  padding:12px 14px; cursor:pointer; list-style:none; display:flex; gap:10px;
  align-items:baseline; justify-content:space-between;
}
.entry > summary::-webkit-details-marker{display:none}
.entry .etitle{font-size:.88rem; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.entry .edate{flex:0 0 auto; font-size:.72rem; color:var(--ink-3); font-variant-numeric:tabular-nums}
.entry .ebody{padding:0 14px 14px; display:flex; flex-direction:column; gap:11px}
.entry .etext{
  font-family:var(--serif); font-size:1.02rem; line-height:1.6; white-space:pre-wrap;
  padding:12px 13px; background:var(--sheet-2); border-radius:var(--r-m); border:1px solid var(--line);
}
.entry .eprompt{font-size:.8rem; color:var(--ink-3); font-style:italic}

.note{
  background:var(--amber-soft); border-radius:var(--r-m); padding:12px 14px;
  font-size:.86rem; color:var(--ink-2); line-height:1.5;
}
.note b{color:var(--amber)}
.trap{
  background:var(--wrong-soft); border-radius:var(--r-m); padding:12px 14px;
  font-size:.88rem; line-height:1.5; color:var(--ink-2);
}
.reveal{background:var(--right-soft); border-radius:var(--r-m); padding:13px 14px}

.toast{
  position:fixed; left:50%; bottom:88px; transform:translateX(-50%);
  background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:100px;
  font-size:.84rem; font-weight:600; z-index:60; box-shadow:var(--shadow-2);
  opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  max-width:88vw; text-align:center;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px)}

.copybox{width:100%; min-height:130px; font-size:.8rem; font-family:var(--sans)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important; transition-duration:.01ms !important}
}
@media (min-width:600px){
  body{font-size:17px}
  main{padding:20px 18px 10px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="iconbtn" id="backBtn" aria-label="Zurück" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="topbar-mid">
      <span class="daytag" id="dayTag">Tag 1</span>
      <span class="topbar-title" id="topTitle">Daily English</span>
    </div>
    <span class="clock" id="clock" hidden>0:00</span>
  </header>
  <div class="rail" id="rail" hidden></div>
  <main id="main"></main>
  <footer class="dock" id="dock"></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* ============================================================
   INHALT — 26 Einheiten, nur M3W-Stoff (Wortschatz: siehe VOCAB und WORDFORM weiter unten)
   Grundlage: Kursprogramm „English for Business Computing" (Tenses active/passive,
   Adjective/Adverb, Conditional Clauses 1–3) und die Altklausuren SS18 und
   WiSe 2020/21 (Relativsätze, Conditionals, Übersetzen Deutsch → Englisch).
   ============================================================ */
const BLOCKS = [
  {from:1,  to:10, short:"Zeiten",     name:"Zeiten"},
  {from:11, to:16, short:"Passiv & If", name:"Passiv & Conditionals"},
  {from:17, to:21, short:"Satzbau",    name:"Relativsätze, Adjektiv/Adverb, Verbindungswörter"},
  {from:22, to:26, short:"Kurs",       name:"Kursthemen: Trends, Meetings, Meinung, Präsentation"}
];
const blockOf = i => BLOCKS.find(b => i + 1 >= b.from && i + 1 <= b.to) || BLOCKS[0];
const areaOf = i => blockOf(i).short;

const UNITS = [
/* ---------- Zeiten (aktiv) ---------- */
{t:"Present Simple oder Progressive",
 g:"Present Simple für Gewohnheiten, Fakten und Abläufe. Present Progressive für das, was gerade oder in dieser Phase läuft. Deutsch macht diesen Unterschied nicht, deshalb fällt er beim Schreiben leicht unter den Tisch.",
 ex:["We usually order from two suppliers.","At the moment we are looking for a third one."],
 err:"„Ich arbeite gerade am Bericht\" ist nicht <b>I work on the report</b>, sondern <b>I am working on the report</b>. Ohne <b>am</b> klingt es, als wäre das dein Beruf.",
 fix:[
  {s:"Sorry, I can't talk right now — I work on the quarterly report.", i:8, fix:"am working",
   why:"Es passiert genau jetzt → Present Progressive. <b>I work on reports</b> hieße: das ist generell mein Job."},
  {s:"Every day our warehouse is closing at six.", i:5, fix:"closes", full:"Every day our warehouse closes at six.",
   why:"<b>Every day</b> ist eine Gewohnheit → Present Simple. Das <b>is</b> fällt komplett weg."},
  {s:"I am knowing the answer to that question.", i:2, fix:"know", full:"I know the answer to that question.",
   why:"<b>know, understand, want, need, like, believe</b> beschreiben Zustände. Sie stehen nie in der -ing-Form."}],
 tr:[
  {de:"Wir suchen im Moment einen neuen Lieferanten.", en:"At the moment we are looking for a new supplier.",
   tip:"<b>At the moment</b> ist das klarste Signalwort für Progressive."},
  {de:"Die Firma stellt jedes Jahr ungefähr zwanzig Leute ein.", en:"The company hires about twenty people every year.",
   tip:"<b>every year</b> = Gewohnheit, also Simple. Und das <b>-s</b> bei <b>hires</b> nicht vergessen."},
  {de:"Ich brauche die Zahlen bis Freitag.", en:"I need the figures by Friday.",
   tip:"<b>need</b> ist ein Zustandsverb — <b>I am needing</b> gibt es nicht."}],
 wr:{p:"Beschreib deinen Job oder dein Studium: drei Sätze darüber, was normalerweise abläuft, und drei darüber, woran du gerade in diesen Wochen sitzt.",
  short:"Zwei Sätze mit „normalerweise\", zwei mit „gerade jetzt\".",
  ph:["I usually work on …","Once a week we …","At the moment I am …","This month we are trying to …","Normally the team meets …","Right now I am dealing with …"],
  ck:["Alles Regelmäßige im Simple?","Alles, was gerade läuft, mit am/is/are + -ing?","Kein know / want / need in der -ing-Form?"]}},

{t:"Das -s in der dritten Person",
 g:"Bei he, she, it und jedem einzelnen Ding oder Namen bekommt das Verb im Present Simple ein -s. Das ist der Fehler, der einem Muttersprachler sofort ins Ohr springt.",
 ex:["The department sends the report every Monday.","She works in purchasing, he works in sales."],
 err:"<b>She work</b> ❌ → <b>She works</b> ✅. Aber nach <b>does</b> fällt das -s wieder weg: <b>She doesn't works</b> ❌ → <b>She doesn't work</b> ✅.",
 fix:[
  {s:"Our supplier deliver on Tuesdays and Fridays.", i:2, fix:"delivers",
   why:"<b>Our supplier</b> ist einer, zählt also als he/she/it. Das Verb braucht das <b>-s</b>."},
  {s:"He doesn't works in the head office anymore.", i:2, fix:"work",
   why:"Das <b>-s</b> steckt schon in <b>doesn't</b>. Danach kommt immer die Grundform."},
  {s:"The manager go to Vienna twice a month.", i:2, fix:"goes",
   why:"Nach <b>-o</b> wird das -s zu <b>-es</b>: go → goes, do → does, watch → watches."}],
 tr:[
  {de:"Sie arbeitet in der Personalabteilung.", en:"She works in the human resources department.",
   tip:"<b>works</b>, nicht <b>work</b>. Der häufigste Fehler überhaupt — und der billigste Punktverlust."},
  {de:"Die Firma zahlt keine Provision.", en:"The company doesn't pay a commission.",
   tip:"<b>doesn't</b> trägt das -s schon. Danach <b>pay</b>, nicht <b>pays</b>."},
  {de:"Wer kümmert sich um die Beschwerden?", en:"Who deals with the complaints?",
   tip:"<b>Who</b> zählt als dritte Person Einzahl: <b>deals</b>."}],
 wr:{p:"Stell drei Leute aus deinem Umfeld vor — Kollegen, Freunde, Familie. Je zwei Sätze: was diese Person macht und was sie nicht macht.",
  short:"Drei Sätze über eine Person: was sie macht, nicht macht, und wie oft.",
  ph:["He works as a …","She is responsible for …","He doesn't like …","She deals with …","He usually starts at …","She never …"],
  ck:["Hat jedes Verb nach he/she/it ein -s?","Nach doesn't wieder die Grundform?","go → goes, do → does, watch → watches beachtet?"]}},

{t:"Past Simple oder Present Perfect",
 g:"Past Simple, wenn klar ist wann. Present Perfect, wenn nur das Ergebnis zählt und der Zeitpunkt offen bleibt. Das deutsche Perfekt deckt beides ab, deshalb ist das ein Dauerfehler.",
 ex:["We launched the product in March.","We have already launched the new product."],
 err:"„Ich habe ihn gestern getroffen\" ist <b>I met him yesterday</b>, nicht <b>I have met him yesterday</b>. Sobald eine feste Zeitangabe im Satz steht, muss Past Simple her.",
 fix:[
  {s:"I have spoken to the supplier last Thursday.", i:1, fix:"", full:"I spoke to the supplier last Thursday.",
   why:"<b>last Thursday</b> ist ein fester Zeitpunkt → Past Simple. <b>have</b> fällt weg und <b>spoken</b> wird zu <b>spoke</b>."},
  {s:"Have you worked there in 2019?", i:0, fix:"Did", full:"Did you work there in 2019?",
   why:"<b>in 2019</b> ist abgeschlossen → Past Simple. Nach <b>Did</b> steht die Grundform: <b>work</b>."},
  {s:"We didn't received your invoice yet.", i:1, fix:"haven't", full:"We haven't received your invoice yet.",
   why:"<b>yet</b> gehört zum Present Perfect. Es geht um den Stand jetzt, nicht um einen Zeitpunkt."}],
 tr:[
  {de:"Wir haben den Vertrag letzten Monat gekündigt.", en:"We cancelled the contract last month.",
   tip:"<b>last month</b> → Past Simple, ganz ohne <b>have</b>."},
  {de:"Ich habe noch nie in England gearbeitet.", en:"I have never worked in England.",
   tip:"Erfahrung ohne Zeitpunkt → Present Perfect. <b>never, ever, already, yet</b> sind die Signalwörter."},
  {de:"Die Preise sind dieses Jahr dreimal gestiegen.", en:"Prices have risen three times this year.",
   tip:"<b>this year</b> läuft noch → Present Perfect. Bei <b>last year</b> müsste Past Simple stehen."}],
 wr:{p:"Schreib über eine Aufgabe, die du wirklich erledigt hast: erst was wann passiert ist, dann was bis heute daraus geworden ist.",
  short:"Zwei Sätze mit fester Zeitangabe, zwei mit already, yet oder never.",
  ph:["Two weeks ago I started …","In the end we decided to …","Since then the situation has …","I have already finished …","We haven't solved … yet.","It has been a useful experience."],
  ck:["Steht bei jeder festen Zeitangabe Past Simple?","Present Perfect nur da, wo kein Zeitpunkt genannt ist?","already / yet / never / ever richtig eingebaut?"]}},

{t:"since, for und ago",
 g:"since nennt den Startpunkt, for die Dauer, ago den Abstand zu heute. Deutsch benutzt für alle drei gern „seit\" — im Englischen sind das drei verschiedene Sätze.",
 ex:["I have worked here since 2021.","I have worked here for four years.","I started here four years ago."],
 err:"<b>I work here since 2021</b> ❌ — mit <b>since</b> und <b>for</b> muss Present Perfect her: <b>I have worked here since 2021</b> ✅.",
 fix:[
  {s:"We are waiting for an answer since Monday.", i:1, fix:"have been", full:"We have been waiting for an answer since Monday.",
   why:"<b>since</b> zwingt zum Perfect: <b>have been waiting</b>. Present Progressive allein reicht nicht."},
  {s:"She has been with the company since five years.", i:6, fix:"for",
   why:"<b>five years</b> ist eine Dauer, kein Startpunkt → <b>for</b>. <b>since</b> nur bei 2019, Monday, last week."},
  {s:"I have handed in my notice three weeks ago.", i:1, fix:"", full:"I handed in my notice three weeks ago.",
   why:"<b>ago</b> verlangt immer Past Simple. <b>have … ago</b> gibt es nicht."}],
 tr:[
  {de:"Ich lerne seit acht Monaten Englisch.", en:"I have been learning English for eight months.",
   tip:"Dauer → <b>for</b>, und Perfect Progressive, weil es noch läuft."},
  {de:"Wir kennen den Lieferanten seit 2019.", en:"We have known the supplier since 2019.",
   tip:"Startpunkt → <b>since</b>. <b>know</b> nie mit -ing, deshalb <b>have known</b>."},
  {de:"Sie hat vor zwei Jahren gekündigt.", en:"She resigned two years ago.",
   tip:"<b>ago</b> → Past Simple, kein <b>have</b>."}],
 wr:{p:"Wie lange machst du die Dinge in deinem Leben schon? Schreib über Job, Wohnort, Hobbys und eine Sache, die du aufgehört hast — mit since, for und ago.",
  short:"Je ein Satz mit since, for und ago.",
  ph:["I have lived in … since …","I have been doing … for … years.","I started … about … years ago.","Until two years ago I …","It has been a while since I …","I have known … since school."],
  ck:["since + Zeitpunkt, for + Dauer?","Bei since und for: have/has + dritte Form?","ago immer mit Past Simple, nie mit have?"]}},

{t:"Present Perfect Progressive",
 g:"have oder has been plus Verb-ing. Es geht um die Dauer einer Sache, die angefangen hat und noch läuft oder gerade eben erst aufgehört hat.",
 ex:["We have been negotiating for three hours.","She has been working here since April."],
 err:"Der Unterschied: <b>I have written three emails</b> zählt Ergebnisse. <b>I have been writing emails all morning</b> betont die Zeit, die draufgegangen ist.",
 fix:[
  {s:"I have been knowing him for years.", i:3, fix:"known", full:"I have known him for years.",
   why:"Zustandsverben wie <b>know, be, own, believe</b> gehen nicht in die Progressive-Form."},
  {s:"How long are you working on this proposal?", i:2, fix:"have", full:"How long have you been working on this proposal?",
   why:"<b>How long …?</b> fragt nach der Dauer bis jetzt → <b>have you been working</b>."},
  {s:"She has been finished the report.", i:2, fix:"", full:"She has finished the report.",
   why:"<b>finish</b> ist ein Ergebnis, keine Dauer → normales Present Perfect: <b>has finished</b>."}],
 tr:[
  {de:"Wir verhandeln seit zwei Wochen über den Preis.", en:"We have been negotiating the price for two weeks.",
   tip:"Dauer, läuft noch → <b>have been</b> plus -ing."},
  {de:"Sie sitzt schon den ganzen Vormittag an der Präsentation.", en:"She has been working on the presentation all morning.",
   tip:"<b>all morning</b> betont, wie viel Zeit draufging."},
  {de:"Wie lange arbeitest du schon in dieser Branche?", en:"How long have you been working in this industry?",
   tip:"Klassische Interviewfrage. Nie <b>How long are you working</b>."}],
 wr:{p:"Was beschäftigt dich gerade schon länger? Schreib über zwei Dinge, an denen du seit Wochen dran bist, und was bisher dabei rausgekommen ist.",
  short:"Zwei Sätze mit have been + -ing, einer mit dem Ergebnis.",
  ph:["I have been working on … for …","We have been trying to … since …","It has been taking longer than expected.","So far I have finished …","I have been thinking about …","Lately I have been …"],
  ck:["have/has been + Verb-ing sauber gebaut?","Kein know / be / want in der -ing-Form?","Ergebnisse im normalen Perfect, Dauer in der Progressive?"]}},

{t:"Past Progressive",
 g:"was oder were plus Verb-ing. Für das, was in der Vergangenheit gerade lief — meist als Hintergrund für etwas, das dazwischenkam.",
 ex:["I was working on the report when she called.","While we were discussing the price, the client left."],
 err:"Der Trick ist das Zusammenspiel: die lange Handlung im Past Progressive, die kurze im Past Simple. <b>I was driving when the phone rang.</b>",
 fix:[
  {s:"I worked on the report when the phone rang.", i:1, fix:"was working",
   why:"Die längere Handlung im Hintergrund steht im Past Progressive: <b>I was working</b>."},
  {s:"While we were discuss the contract, he arrived.", i:3, fix:"discussing",
   why:"Nach <b>were</b> kommt die -ing-Form: <b>were discussing</b>."},
  {s:"They were wanting a discount at that time.", i:2, fix:"", full:"They wanted a discount at that time.",
   why:"Zustandsverben wie <b>want, know, need</b> gehen nicht in die Progressive-Form: <b>They wanted</b>."}],
 tr:[
  {de:"Ich arbeitete gerade am Bericht, als sie anrief.", en:"I was working on the report when she called.",
   tip:"Lange Handlung Progressive, kurze Unterbrechung Simple."},
  {de:"Während wir über den Preis sprachen, ging der Kunde.", en:"While we were talking about the price, the client left.",
   tip:"<b>While</b> zieht fast immer die Progressive-Form nach sich."},
  {de:"Was hast du gestern um drei gemacht?", en:"What were you doing yesterday at three?",
   tip:"Uhrzeit in der Vergangenheit → Past Progressive."}],
 wr:{p:"Erzähl von einem Tag, an dem etwas dazwischenkam: was lief gerade, was hat es unterbrochen, wie ging es aus? Mindestens drei Past-Progressive-Sätze.",
  short:"Drei Sätze: was gerade lief, was dazwischenkam.",
  ph:["I was … when …","While we were …, …","At that moment I was …","Suddenly the phone rang.","It was raining, so we …","In the end everything was fine."],
  ck:["Lange Handlung mit was / were + -ing?","Kurze Unterbrechung im Past Simple?","Kein want / know / need in der -ing-Form?"]}},

{t:"Past Perfect",
 g:"had plus dritte Verbform. Für das, was vor einer anderen Vergangenheitshandlung schon passiert war. Man braucht es nur da, wo die Reihenfolge sonst unklar wäre.",
 ex:["When we arrived, the meeting had already started.","They had signed the contract before the prices went up."],
 err:"Nicht überall Past Perfect reinstreuen. Erzählst du der Reihe nach, reicht Past Simple: <b>I came in, sat down and opened my laptop.</b>",
 fix:[
  {s:"When I arrived, the client already left.", i:6, fix:"had left.", full:"When I arrived, the client had already left.",
   why:"Der Kunde war schon weg, <b>bevor</b> du ankamst. Die frühere Handlung geht eine Stufe zurück: <b>had left</b> — und <b>already</b> rutscht dabei zwischen <b>had</b> und <b>left</b>."},
  {s:"She told me that she has finished the training.", i:5, fix:"had",
   why:"Der Rahmensatz steht in der Vergangenheit (<b>told</b>), also rutscht der Nebensatz mit zurück."},
  {s:"After we have checked the figures, we sent the report.", i:2, fix:"had",
   why:"<b>After, before, by the time</b> plus Vergangenheit → <b>had checked</b>."}],
 tr:[
  {de:"Als wir ankamen, hatte die Besprechung schon angefangen.", en:"When we arrived, the meeting had already started.",
   tip:"Zwei Vergangenheiten in einem Satz: die frühere bekommt <b>had</b>."},
  {de:"Er sagte, er habe die Rechnung nie bekommen.", en:"He said he had never received the invoice.",
   tip:"Indirekte Rede in der Vergangenheit → alles eine Stufe zurück."},
  {de:"Bevor sie die Stelle annahm, hatte sie in Irland gearbeitet.", en:"Before she took the job, she had worked in Ireland.",
   tip:"Der spätere Satz steht im Past Simple, der frühere im Past Perfect."}],
 wr:{p:"Erzähl von einer Situation, in der etwas schiefging: was war vorher schon passiert, und was ist am Ende daraus geworden? Mindestens zweimal had plus dritte Form.",
  short:"Drei Sätze über etwas, das schiefging — mindestens einer mit had.",
  ph:["By the time I arrived, the … had already …","We had planned to …, but then …","Before that happened, I had …","It turned out that someone had …","In the end everything worked out.","Looking back, I should have …"],
  ck:["Steht die frühere Handlung im Past Perfect?","had + dritte Form, nicht had + Grundform?","Nicht überall had — nur wo die Reihenfolge zählt?"]}},

{t:"Past Perfect Progressive",
 g:"had been plus Verb-ing. Für das, was vor einem Punkt in der Vergangenheit schon eine Weile gelaufen war. Es betont die Dauer davor.",
 ex:["We had been waiting for two hours when the delivery finally arrived.","She had been working there for five years before she resigned."],
 err:"Unterschied zum Past Perfect: <b>I had written three emails</b> zählt das Ergebnis, <b>I had been writing emails all morning</b> betont die Zeit, die vorher draufging.",
 fix:[
  {s:"We had waiting for two hours when the goods arrived.", i:2, fix:"been waiting",
   why:"Nach <b>had</b> fehlt das <b>been</b>: <b>had been waiting</b>."},
  {s:"She had been work there for five years before she left.", i:3, fix:"working",
   why:"Nach <b>had been</b> kommt die -ing-Form: <b>had been working</b>."},
  {s:"He had been knowing the client for years before the deal.", i:3, fix:"known", full:"He had known the client for years before the deal.",
   why:"Zustandsverben wie <b>know</b> gehen auch hier nicht in die Progressive-Form: <b>had known</b>."}],
 tr:[
  {de:"Wir hatten zwei Stunden gewartet, als die Lieferung endlich kam.", en:"We had been waiting for two hours when the delivery finally arrived.",
   tip:"Dauer vor einem Punkt in der Vergangenheit."},
  {de:"Sie hatte fünf Jahre dort gearbeitet, bevor sie kündigte.", en:"She had been working there for five years before she resigned.",
   tip:"<b>for five years</b> ist eine Dauer, also Progressive."},
  {de:"Ich war müde, weil ich den ganzen Tag telefoniert hatte.", en:"I was tired because I had been making calls all day.",
   tip:"Der Grund lag davor und hat gedauert."}],
 wr:{p:"Erzähl von etwas, das lange lief, bevor es endlich klappte oder scheiterte: Wie lange ging es schon, und was kam dann? Mindestens drei Sätze mit had been.",
  short:"Drei Sätze: wie lange etwas lief, bevor etwas passierte.",
  ph:["I had been … for … when …","We had been trying to … before …","She had been working on … all week.","By that time I had been …","That was because I had been …","After that, everything changed."],
  ck:["had been plus Verb-ing vollständig gebaut?","Dauer gemeint, nicht nur das Ergebnis?","Kein know / be / want in der -ing-Form?"]}},

{t:"Zukunft: will, going to, Progressive",
 g:"will für spontane Entscheidungen, Versprechen und Vorhersagen. going to für Pläne und für das, was sich sichtbar abzeichnet. Present Progressive für feste Termine, Present Simple für Fahrpläne und feste Abläufe.",
 ex:["I'll send you the figures right away.","We are going to open a second branch.","I am meeting the auditor on Thursday.","The train leaves at 6.15."],
 err:"Deutsch hat nur „werden\". Englisch trennt sauber: <b>I'm meeting him at three</b> (Termin steht) ist etwas anderes als <b>I'll meet him</b> (gerade entschieden).",
 fix:[
  {s:"Look at the clouds — it will rain.", i:6, fix:"is going to",
   why:"Es gibt sichtbare Anzeichen → <b>going to</b>. <b>will</b> wäre eine reine Vermutung ohne Beleg."},
  {s:"Don't worry, I am going to help you with that.", i:3, fix:"will", full:"Don't worry, I will help you with that.",
   why:"Spontan angeboten, gerade in diesem Moment entschieden → <b>will</b>. <b>going to</b> wäre ein Plan von vorher."},
  {s:"I will meet the supplier tomorrow at ten, it's in my calendar.", i:1, fix:"am meeting", full:"I am meeting the supplier tomorrow at ten, it's in my calendar.",
   why:"Fester Termin mit Uhrzeit → Present Progressive. So redet man über den Kalender."}],
 tr:[
  {de:"Ich schicke Ihnen die Unterlagen sofort.", en:"I'll send you the documents right away.",
   tip:"Spontan zugesagt → <b>will</b>. Einer der häufigsten Sätze in Business-Mails."},
  {de:"Wir werden nächstes Jahr eine zweite Filiale eröffnen.", en:"We are going to open a second branch next year.",
   tip:"Fester Plan, schon beschlossen → <b>going to</b>."},
  {de:"Ich treffe den Wirtschaftsprüfer am Donnerstag um neun.", en:"I am meeting the auditor on Thursday at nine.",
   tip:"Termin steht im Kalender → Present Progressive."}],
 wr:{p:"Wie sieht deine nächste Woche aus? Schreib feste Termine, Pläne und eine Vorhersage — und benutz alle drei Zukunftsformen mindestens einmal.",
  short:"Ein Termin, ein Plan, eine Vorhersage — je ein Satz.",
  ph:["On Monday I am …","We are going to …","I think prices will …","I'll probably …","The meeting starts at …","By the end of the week I will have …"],
  ck:["Feste Termine im Present Progressive?","Pläne mit going to?","Spontanes und Vorhersagen mit will?"]}},

{t:"will have und will be doing",
 g:"will have plus dritte Form sagt, was bis zu einem Zeitpunkt fertig sein wird. will be plus Verb-ing sagt, was zu einem Zeitpunkt gerade läuft. Beides brauchst du für Prognosen und Planungen.",
 ex:["By 2028 we will have doubled our turnover.","This time next week I will be working in Dublin."],
 err:"Es gibt auch <b>will have been working</b>, das Future Perfect Progressive. Korrekt, aber in der Praxis fast nie nötig — merk dir die zwei oben.",
 fix:[
  {s:"By the end of the year we will finish the project.", i:8, fix:"have finished",
   why:"<b>By …</b> fragt, was bis dahin fertig ist → <b>will have finished</b>."},
  {s:"By 2028 we will have double our turnover.", i:5, fix:"doubled",
   why:"Nach <b>will have</b> kommt die dritte Form: <b>will have doubled</b>."},
  {s:"This time next week I will work in Dublin.", i:6, fix:"be working",
   why:"Zu diesem Zeitpunkt läuft es gerade → <b>will be working</b>."}],
 tr:[
  {de:"Bis 2028 werden wir unseren Umsatz verdoppelt haben.", en:"By 2028 we will have doubled our turnover.",
   tip:"<b>By</b> plus <b>will have</b> plus dritte Form. Standardsatz in jeder Prognose."},
  {de:"Nächste Woche um diese Zeit sitze ich schon in Dublin.", en:"This time next week I will be working in Dublin.",
   tip:"<b>will be</b> plus -ing für das, was dann gerade läuft."},
  {de:"Bis Freitag werde ich den Bericht fertig haben.", en:"I will have finished the report by Friday.",
   tip:"<b>by Friday</b> heißt: bis dahin fertig → Future Perfect."}],
 wr:{p:"Schreib eine Prognose: Wo stehst du oder deine Firma in drei Jahren? Was wird bis dahin erledigt sein, und was wird dann gerade laufen?",
  short:"Zwei Sätze mit will have, einer mit will be doing.",
  ph:["By 2029 I will have …","In three years we will have …","This time next year I will be …","By then the company will be …","I hope I will have finished …","We will still be working on …"],
  ck:["will have plus dritte Form für alles Fertige?","will be plus -ing für alles Laufende?","by plus Zeitpunkt beim Future Perfect?"]}},

/* ---------- Passiv & Conditionals ---------- */
{t:"Passiv bilden",
 g:"to be plus dritte Verbform. Man nimmt es, wenn wichtiger ist, was passiert, als wer es tut. In Berichten und offiziellen Texten steht es überall.",
 ex:["The invoice was sent on Monday.","The new system is being tested at the moment."],
 err:"Der Verursacher kommt mit <b>by</b>: <b>The report was written by the trainee</b>. Meistens lässt man ihn ganz weg — genau dafür gibt es das Passiv.",
 fix:[
  {s:"The contract was sign last Friday.", i:3, fix:"signed",
   why:"Passiv braucht die dritte Form: <b>was signed</b>."},
  {s:"The goods have delivered yesterday morning.", i:2, fix:"were", full:"The goods were delivered yesterday morning.",
   why:"Die Waren liefern nicht selbst, sie werden geliefert: <b>were delivered</b>."},
  {s:"Our website is currently update by an agency.", i:4, fix:"being updated",
   why:"Läuft gerade → <b>is being updated</b>. Die dritte Form nicht vergessen."}],
 tr:[
  {de:"Die Rechnung wurde am Montag verschickt.", en:"The invoice was sent on Monday.",
   tip:"<b>was</b> plus dritte Form. Wer sie verschickt hat, bleibt offen."},
  {de:"Das neue System wird gerade getestet.", en:"The new system is being tested at the moment.",
   tip:"Passiv im Progressive: <b>is being</b> plus dritte Form."},
  {de:"Die Firma wurde 1998 gegründet.", en:"The company was founded in 1998.",
   tip:"Standardsatz für Firmenporträts. <b>founded</b>, nicht <b>found</b>."}],
 wr:{p:"Beschreib einen Ablauf in deiner Firma oder Schule von außen: Was wird gemacht, geprüft, verschickt, entschieden? Mindestens sechs Passivsätze.",
  short:"Drei Passivsätze über einen Ablauf.",
  ph:["The order is checked by …","The goods are delivered within … days.","The invoice is sent automatically.","The decision was made last week.","Our systems are being updated.","The report has been approved."],
  ck:["Überall to be plus dritte Form?","Die richtige Zeit steckt im to be?","by nur da, wo der Verursacher wirklich zählt?"]}},

{t:"Passiv in Prozessen",
 g:"Im Bericht baut man eine Kette: erst was passiert, dann in welcher Reihenfolge. First, then, after that und finally halten die Passivsätze zusammen.",
 ex:["First the order is received. Then it is checked by the warehouse.","After that, the goods are packed and shipped."],
 err:"Nicht jeden Satz gleich anfangen. Drei Sätze mit <b>The order is …</b> sind grammatisch richtig und trotzdem schlecht. Verbinde mit <b>then, after that, once</b>.",
 fix:[
  {s:"After the order has checked, it is sent to the warehouse.", i:3, fix:"has been", full:"After the order has been checked, it is sent to the warehouse.",
   why:"Passiv im Present Perfect: <b>has been checked</b>. Das <b>been</b> fehlt."},
  {s:"Finally, the goods are pack and shipped to the customer.", i:4, fix:"packed",
   why:"Beide Verben brauchen die dritte Form: <b>are packed and shipped</b>."},
  {s:"The complaint was dealt by the service team.", i:4, fix:"with by",
   why:"<b>deal with</b> behält im Passiv sein <b>with</b>: <b>was dealt with by …</b>"}],
 tr:[
  {de:"Zuerst wird die Bestellung geprüft.", en:"First the order is checked.",
   tip:"<b>First</b> ohne <b>at</b>. <b>At first</b> hieße: anfangs, aber später anders."},
  {de:"Danach werden die Waren verpackt und verschickt.", en:"After that, the goods are packed and shipped.",
   tip:"Beide Verben in der dritten Form."},
  {de:"Sobald die Rechnung bezahlt wurde, wird die Ware freigegeben.", en:"Once the invoice has been paid, the goods are released.",
   tip:"<b>has been paid</b> — Passiv im Present Perfect."}],
 wr:{p:"Beschreib einen kompletten Ablauf in sechs bis acht Schritten — eine Bestellung, eine Bewerbung, eine Reklamation. Alles im Passiv, verbunden mit first, then, after that, finally.",
  short:"Vier Schritte eines Ablaufs im Passiv.",

  {s:"If I was you, I would accept the offer.", i:2, fix:"were",
   why:"Feste Wendung: <b>If I were you</b>. Im Second Conditional steht <b>were</b> für alle Personen."},
  {s:"If we had more staff, we will take on the project.", i:6, fix:"would",
   why:"Der if-Teil steht im Past Simple, also ist die Lage gedacht → <b>would</b>, nicht <b>will</b>."}],
 tr:[
  {de:"Wenn ich der Chef wäre, würde ich in neue Märkte investieren.", en:"If I were the CEO, I would invest in new markets.",

  {de:"An Ihrer Stelle würde ich das Angebot annehmen.", en:"If I were you, I would accept the offer.",

  {de:"Wenn wir mehr Personal hätten, könnten wir den Auftrag annehmen.", en:"If we had more staff, we could take on the order.",

  {s:"If the EU had lowered the tariffs, trade would grown.", i:9, fix:"have grown.",
   why:"Der Third Conditional braucht <b>would have</b> plus dritte Form: <b>would have grown</b>."},
  {s:"If she had taken the job, she would have lived in Dublin now.", i:8, fix:"be", full:"If she had taken the job, she would be living in Dublin now.",

  short:"Drei Sätze nach dem Muster: Wenn ich … gemacht hätte, wäre …",

 tr:[

const KEY = "dailyEnglish.v2";
const BLANK = {
  topics:{},          // je Thema: {n: Runden, ok: Treffer, total: Aufgaben}
  texts:[],
  vocab:{},           // je Wortschatz-Aufgabe: {n: wie oft, ok: Treffer, s: Treffer in Folge, l: letzter Versuch richtig (1/0)}
  stats:{fixOk:0, fixN:0, trOk:0, trN:0, words:0, seconds:0, rounds:0, vocOk:0, vocN:0, vocRounds:0}
};

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return structuredClone(BLANK);
    const s = JSON.parse(raw);
    return Object.assign(structuredClone(BLANK), s, {stats:Object.assign(structuredClone(BLANK.stats), s.stats||{})});
  }catch(e){ return structuredClone(BLANK); }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
let S = load();

/* Datum nach Ortszeit — toISOString() rechnet in UTC und liefert kurz nach Mitternacht noch den Vortag */
const today = () => {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
};

/* Nächstes Thema: erst was du noch nie hattest, danach das, was am schlechtesten sitzt.
   Kein Kalender, kein Tageszähler — die App entscheidet, du drückst nur Start. */
/* nach Titel gespeichert, nicht nach Position — so überlebt der Fortschritt neue Themen */
function topicStat(i){ return S.topics[UNITS[i].t] || {n:0, ok:0, total:0}; }
function strength(i){ const t = topicStat(i); return t.total ? t.ok / t.total : null; }
function pickNext(){
  let best = 0, bestScore = Infinity;
  for(let i = 0; i < UNITS.length; i++){
    const t = topicStat(i);
    const score = t.n * 10 + (t.total ? (t.ok / t.total) * 3 : 0);
    if(score < bestScore){ bestScore = score; best = i; }
  }
  return best;
}

/* ============================================================
   WORTSCHATZ-AUSWAHL
   Vier Aufgabenarten: def (Begriff definieren), find (Begriff zur Definition),
   wf (Wortbildung), tr (Übersetzen gemischt: Conditionals, Relativsätze, Passiv).
   Reihenfolge: erst was zuletzt daneben ging, dann Neues, dann was am wenigsten sitzt.
   ============================================================ */
const VKIND = {
  def:  {label:"Definieren",       pre:"d:"},
  find: {label:"Begriff finden",   pre:"f:"},
  wf:   {label:"Wortbildung",      pre:"w:"},
  tr:   {label:"Übersetzen gemischt", pre:"t:"},
  fs:   {label:"Fokussätze",       pre:"s:"}
};
const MIX_UNITS = /Conditional|Relativs|Passiv|unless/;

function vocabItems(kind){
  if(kind === "def" || kind === "find")
    return VOCAB.map(v => ({kind, id: VKIND[kind].pre + v.w, word: v.w, v}));
  if(kind === "wf")
    return WORDFORM.map(x => ({kind, id: "w:" + x.b + ">" + x.a[0], x}));
  if(kind === "fs")
    return FOCUS.items.filter(f => FOCUS.active.includes(f.m)).map(f => ({kind, id: "s:" + f.de, f}));
  const out = [];
  UNITS.forEach(u => { if(MIX_UNITS.test(u.t)) u.tr.forEach(t => out.push({kind, id: "t:" + t.de, t, unit: u.t})); });
  return out;
}
function vscore(id){
  const st = S.vocab[id];
  if(!st) return 1;              // neu
  if(st.l === 0) return 0;       // zuletzt daneben: kommt zuerst wieder
  return 2 + (st.s || 1);        // sitzt: je länger die Serie, desto später
}
function shuffled(a){
  const r = a.slice();
  for(let i = r.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; }
  return r;
}
/* spec: [["def",1],["find",1],…] — ein Begriff kommt in einer Runde nie doppelt vor.
   Bei "fs" engt ein dritter Wert auf ein Muster ein: ["fs",1,"pron"] */
function buildRound(spec){
  const used = new Set(), round = [];
  spec.forEach(([kind, n, m]) => {
    const items = vocabItems(kind).filter(it => !m || it.f.m === m);
    /* eigene Sätze aus dem Drill kommen vor fremden neuen Sätzen dran */
    const key = it => vscore(it.id) - (it.f && it.f.own && !S.vocab[it.id] ? 0.5 : 0);
    const pool = shuffled(items).sort((a, b) => key(a) - key(b));
    let got = 0;
    for(const it of pool){
      if(got >= n) break;
      if(it.word && used.has(it.word)) continue;
      if(it.word) used.add(it.word);
      round.push(it); got++;
    }
  });
  return round;
}
/* Antwort vergleichen: Groß/Klein, Artikel, „to", Bindestriche und Satzzeichen zählen nicht */
function norm(t){
  return String(t).toLowerCase().replace(/[-‐–]/g, " ").replace(/[^a-z' ]/g, " ")
    .replace(/\s+/g, " ").trim().replace(/^(a|an|the|to) /, "");
}
function accepts(it, answer){
  const a = norm(answer);
  if(!a) return false;
  if(it.kind === "wf") return it.x.a.some(x => norm(x) === a);   // hier zählt die genaue Form
  const sg = x => x.replace(/s$/, "");                            // Einzahl oder Mehrzahl ist beim Begriff egal
  return [it.v.w].concat(it.v.alt || []).some(x => sg(norm(x)) === sg(a));
}
function vocabLabel(it){
  if(it.kind === "wf") return it.x.b.toUpperCase() + " → " + it.x.a[0];
  if(it.kind === "tr") return it.t.en;
  if(it.kind === "fs") return it.f.en;
  return it.v.w + " — " + it.v.de;
}
function kindStat(kind){
  let n = 0, ok = 0, seen = 0;
  const items = vocabItems(kind);
  items.forEach(it => { const st = S.vocab[it.id]; if(st){ n += st.n; ok += st.ok; seen++; } });
  return {n, ok, seen, all: items.length};
}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const words = t => (t.trim().match(/[\p{L}\p{N}'’-]+/gu) || []).length;
function mmss(sec){ const m = Math.floor(sec/60), s = sec%60; return m + ":" + String(s).padStart(2,"0"); }

let toastT = null;
function toast(msg){
  const el = $("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove("show"), 2200);
}

function copy(text, okMsg){
  const done = () => toast(okMsg || "Kopiert");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, () => fallback(text, done));
  } else fallback(text, done);
}
function fallback(text, done){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.cssText = "position:fixed;top:-1000px;left:0;opacity:0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  let ok = false;
  try{ ok = document.execCommand("copy"); }catch(e){}
  ta.remove();
  if(ok) done(); else showManualCopy(text);
}
function showManualCopy(text){
  view = "manual"; manualText = text; render();
}
let manualText = "";

/* Satz aus Tokens + Korrektur zusammensetzen */
function corrected(item){
  if(item.full) return item.full;
  const t = item.s.split(" ").slice();
  if(item.fix === "") t.splice(item.i, 1); else t[item.i] = item.fix;
  return t.join(" ");
}

/* Prompt für den Claude-Check */
function defLines(defs){
  return [
    "Diese Begriffe habe ich auf Englisch definiert (Klausurteil „Definitions“, ein einzelnes Synonym zählt dort nicht):",
    "---"
  ].concat(defs.map(d => d.w + ": " + d.x.trim())).concat(["---"]);
}

/* ============================================================
   SESSION
   ============================================================ */
const STEPS = [
  {k:"rule",  label:"Regel"},
  {k:"fix",   label:"Fehler"},
  {k:"trans", label:"Übersetzen"},
  {k:"focus", label:"Sätze"},
  {k:"vocab", label:"Wörter"},
  {k:"write", label:"Schreiben"}
];
const DAILY_FOCUS = () => FOCUS.active.map(m => ["fs", 1, m]);
const DAILY_VOCAB = [["def",1],["find",1],["wf",1]];
const MIX_ROUND   = [["def",2],["find",2],["wf",2],["tr",2]];

function startSession(mode, unitIdx){
  const idx = (typeof unitIdx === "number" ? unitIdx : pickNext()) % UNITS.length;
  ses = {
    mode, idx, u: UNITS[idx],
    step: mode === "short" ? "write" : "rule",
    fi:0, ti:0, fixOk:0, trOk:0,
    sel:null, shown:false,
    vq: mode === "full" ? buildRound(DAILY_FOCUS().concat(DAILY_VOCAB)) : [], vi:0, vres:[], defs:[],
    text:"", t0:Date.now(), wt0:null
  };
  view = "session";
  startClock();
  render();
}
/* Runde ohne Grammatikthema: nur Wortschatz-Aufgaben. kind = eine Aufgabenart, sonst der Mix. */
function startVocab(kind){
  ses = {
    mode:"vocab", idx:null, u:null, step:"vocab",
    vq: buildRound(kind ? [[kind, 6]] : MIX_ROUND), vi:0, vres:[], defs:[],
    vkind: kind || null,
    sel:null, shown:false, answer:"",
    text:"", t0:Date.now(), wt0:null
  };
  view = "session";
  startClock();
  render();
}
const vocOkCount = () => ses.vres.filter(r => r.ok).length;
function advVocab(ok){
  const it = ses.vq[ses.vi];
  if(it.kind === "def" && (ses.answer || "").trim()) ses.defs.push({w: it.v.w, x: ses.answer});
  ses.vres.push({id: it.id, kind: it.kind, ok: !!ok, label: vocabLabel(it)});
  ses.answer = ""; ses.shown = false; ses.vok = null;
  if(ses.vi === ses.vq.length - 1){
    if(ses.mode === "vocab") finishSession(); else nextStep();
  } else {
    ses.vi++;
    if(ses.step === "focus" && ses.vq[ses.vi].kind !== "fs") ses.step = "vocab";
    render(); window.scrollTo({top:0, behavior:"instant"});
  }
}
function commitVocab(){
  ses.vres.forEach(r => {
    const st = S.vocab[r.id] || {n:0, ok:0, s:0, l:0};
    st.n += 1;
    if(r.ok){ st.ok += 1; st.s += 1; st.l = 1; } else { st.s = 0; st.l = 0; }
    S.vocab[r.id] = st;
    S.stats.vocN += 1; if(r.ok) S.stats.vocOk += 1;
  });
}
function startClock(){
  stopClock();
  tick = setInterval(() => {
    if(!ses) return;
    const c = $("clock");
    if(c) c.textContent = mmss(Math.floor((Date.now() - ses.t0)/1000));
  }, 1000);
}
function stopClock(){ if(tick){ clearInterval(tick); tick = null; } }

function nextStep(){
  const order = ["rule","fix","trans","focus","vocab","write"];
  let i = order.indexOf(ses.step) + 1;
  const hasFs = ses.vq.length && ses.vq[0].kind === "fs";
  if(order[i] === "focus" && !hasFs) i++;
  if(order[i] === "vocab" && (!ses.vq.length || hasFs && ses.vq.every(it => it.kind === "fs"))) i++;
  ses.step = order[i];
  ses.sel = null; ses.shown = false; ses.answer = "";
  if(ses.step === "write") ses.wt0 = Date.now();
  render();
  window.scrollTo({top:0, behavior:"instant"});
}

function finishSession(){
  const secs = Math.floor((Date.now() - ses.t0)/1000);
  const w = words(ses.text);
  const d = today();

  commitVocab();
  if(ses.mode === "vocab"){
    S.stats.seconds += secs;
    S.stats.vocRounds += 1;
    save();
    ses.secs = secs; ses.wcount = 0;
    stopClock();
    view = "done";
    render();
    window.scrollTo({top:0, behavior:"instant"});
    return;
  }

  S.stats.words += w;
  S.stats.seconds += secs;
  S.stats.rounds += 1;

  const t = topicStat(ses.idx);
  t.n += 1;
  if(ses.mode !== "short"){
    t.ok += ses.fixOk + ses.trOk;
    t.total += ses.u.fix.length + ses.u.tr.length;
    S.stats.fixOk += ses.fixOk; S.stats.fixN += ses.u.fix.length;
    S.stats.trOk  += ses.trOk;  S.stats.trN  += ses.u.tr.length;
  }
  S.topics[ses.u.t] = t;

  if(w > 0){
    S.texts.unshift({d, u:ses.u.t, p:ses.u.wr.p, x:ses.text.trim(), w});
    if(S.texts.length > 400) S.texts.length = 400;
  }
  save();

  ses.secs = secs; ses.wcount = w;
  stopClock();
  view = "done";
  render();
  window.scrollTo({top:0, behavior:"instant"});
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  const main = $("main"), dock = $("dock"), rail = $("rail");
  const back = $("backBtn"), clock = $("clock"), tag = $("dayTag"), title = $("topTitle");

  main.innerHTML = ""; dock.innerHTML = ""; rail.innerHTML = "";
  rail.hidden = true; back.hidden = (view === "home"); clock.hidden = (view !== "session");

  const inSession = (view === "session" || view === "done") && ses;
  tag.hidden = !inSession;
  const vocabOnly = inSession && ses.mode === "vocab";
  const sesTitle = !inSession ? "" : vocabOnly ? (ses.vkind ? VKIND[ses.vkind].label : "Klausur-Mix") : ses.u.t;
  if(inSession) tag.textContent = vocabOnly ? "Wortschatz" : areaOf(ses.idx);

  if(view === "home")        { title.textContent = "Daily English"; renderHome(main, dock); }
  else if(view === "session"){ title.textContent = sesTitle; renderRail(rail); renderSession(main, dock); }
  else if(view === "done")   { title.textContent = sesTitle; renderDone(main, dock); }
  else if(view === "topics") { title.textContent = "Themen"; renderTopics(main, dock); }
  else if(view === "archive"){ title.textContent = "Meine Texte"; renderArchive(main, dock); }
  else if(view === "backup") { title.textContent = "Sicherung"; renderBackup(main, dock); }
  else if(view === "manual") { title.textContent = "Zum Kopieren"; renderManual(main, dock); }
}

function renderRail(rail){
  if(ses.mode !== "full") return;
  rail.hidden = false;
  const cur = STEPS.findIndex(s => s.k === ses.step);
  rail.innerHTML = STEPS.map((s,i) =>
    `<div class="seg ${i < cur ? "done" : ""} ${i === cur ? "now" : ""}">
       <div class="seg-bar"></div><span class="seg-label">${s.label}</span>
     </div>`).join("");
}

function btn(label, cls, fn){
  const b = document.createElement("button");
  b.className = "btn " + (cls || "");
  b.textContent = label;
  b.addEventListener("click", fn);
  return b;
}

    </div>
    <p class="small">Regel ansehen · Fehler finden · übersetzen · drei Fokussätze aus dem Writing-Drill · drei Wortschatz-Aufgaben · selbst schreiben. Die App sucht das Thema aus — du drückst nur Start.</p>`;
  main.appendChild(hero);

  const links = document.createElement("div");
  links.className = "stack tight";
  links.appendChild(rowlink("Klausur-Mix", "5 Minuten: definieren, Begriff finden, Wortbildung, übersetzen", () => startVocab()));

  links.appendChild(rowlink("Themen", "Lieber selbst eins aussuchen", () => { view = "topics"; render(); }));

  main.appendChild(links);

  if(S.stats.rounds > 0 || S.stats.vocN > 0){

    sum.className = "small";
    sum.style.textAlign = "center";
    sum.textContent = parts.join(" · ");

function rowlink(title, sub, fn){
  const b = document.createElement("button");
  b.className = "rowlink";
  b.innerHTML = `<span>${esc(title)}<span class="sub">${esc(sub)}</span></span><span class="chev" aria-hidden="true">›</span>`;
  b.addEventListener("click", fn);
  return b;
}

/* ---------- SESSION ---------- */
function renderSession(main, dock){
  if(ses.step === "rule")  return renderRule(main, dock);
  if(ses.step === "fix")   return renderFix(main, dock);
  if(ses.step === "trans") return renderTrans(main, dock);
  if(ses.step === "vocab" || ses.step === "focus") return renderVocab(main, dock);
  if(ses.step === "write") return renderWrite(main, dock);
}

function renderRule(main, dock){
  const u = ses.u;
  const c = document.createElement("div");
  c.className = "card raised stack";
  c.innerHTML = `
    <span class="label accent">Regel</span>
    <h2>${esc(u.t)}</h2>
    <p class="muted">${esc(u.g)}</p>`;
  main.appendChild(c);

  const ex = document.createElement("div");
  ex.className = "card marked stack tight";
  ex.innerHTML = `<span class="label">So sieht's aus</span>` +
    u.ex.map(e => `<p class="en">${esc(e)}</p>`).join("");
  main.appendChild(ex);

  const t = document.createElement("div");
  t.className = "trap";
  t.innerHTML = `<span class="label wrong">Typischer Deutsch-Fehler</span>${u.err}`;
  main.appendChild(t);

  dock.appendChild(btn("Verstanden — weiter", "primary", nextStep));
}

function renderFix(main, dock){
  const u = ses.u, it = u.fix[ses.fi];

  const head = document.createElement("div");
  head.className = "stack tight";
  head.innerHTML = `<span class="label accent">Fehler finden · ${ses.fi + 1} von ${u.fix.length}</span>
    <p class="muted">Tipp auf das Wort, das falsch ist.</p>`;
  main.appendChild(head);

  const card = document.createElement("div");
  card.className = "card marked";
  const box = document.createElement("div");
  box.className = "words";
  it.s.split(" ").forEach((tok, i) => {
    const b = document.createElement("button");
    b.className = "w";
    b.textContent = tok;
    if(ses.shown){
      b.classList.add("locked");
      if(i === it.i){
        b.classList.add("miss");
        if(ses.sel === i) b.classList.add("found");
      } else if(ses.sel === i) b.classList.add("picked");
    } else if(ses.sel === i) b.classList.add("sel");
    if(!ses.shown) b.addEventListener("click", () => { ses.sel = i; render(); });
    box.appendChild(b);
  });
  card.appendChild(box);
  main.appendChild(card);

  if(ses.shown){
    const hit = ses.sel === it.i;
    const rev = document.createElement("div");
    rev.className = "card stack tight";
    rev.style.borderColor = hit ? "var(--right)" : "var(--line)";
    rev.innerHTML = `
      <span class="label ${hit ? "right" : "wrong"}">${hit ? "Richtig erkannt" : "Der Fehler saß hier"}</span>
      <p class="en"><span class="strike">${esc(it.s.split(" ")[it.i])}</span> <span class="ins">${esc(
        it.mv ? "steht an der falschen Stelle" : it.fix === "" ? "gehört gestrichen" : it.fix
      )}</span></p>
      <p class="en" style="margin-top:6px">${esc(corrected(it))}</p>
      <p class="muted" style="margin-top:8px">${it.why}</p>`;
    main.appendChild(rev);
  }

  if(!ses.shown){
    const b = btn("Prüfen", "primary", () => {
      ses.shown = true;
      if(ses.sel === it.i) ses.fixOk++;
      render();
    });
    b.disabled = ses.sel === null;
    dock.appendChild(b);
  } else {
    const last = ses.fi === u.fix.length - 1;
    dock.appendChild(btn(last ? "Weiter zum Übersetzen" : "Nächster Satz", "primary", () => {
      if(last) nextStep();
      else { ses.fi++; ses.sel = null; ses.shown = false; render(); window.scrollTo({top:0,behavior:"instant"}); }
    }));
  }
}

function renderTrans(main, dock){
  const u = ses.u, it = u.tr[ses.ti];

  const head = document.createElement("div");
  head.className = "stack tight";
  head.innerHTML = `<span class="label accent">Übersetzen · ${ses.ti + 1} von ${u.tr.length}</span>
    <p class="muted">Schreib den Satz auf Englisch. Nicht nachschlagen — raten ist Teil der Übung.</p>`;
  main.appendChild(head);

  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<span class="label">Deutsch</span><p class="de" style="font-size:1.05rem;font-weight:600">${esc(it.de)}</p>`;
  main.appendChild(card);

  ta.rows = 3;

      <p class="muted" style="margin-top:8px">${it.tip}</p>`;
    main.appendChild(rev);

    const q = document.createElement("p");
    q.className = "small";
    q.style.textAlign = "center";
    q.textContent = "Ehrlich sein — hattest du das?";
    main.appendChild(q);

    dock.appendChild(btn("Daneben", "no", () => advTrans(false)));

  } else {

      ses.shown = true; render();
    }));

function advTrans(ok){
  if(ok) ses.trOk++;
  const last = ses.ti === ses.u.tr.length - 1;
  ses.answer = ""; ses.shown = false;
  if(last) nextStep();
  else { ses.ti++; render(); window.scrollTo({top:0,behavior:"instant"}); }
}

/* Die Klausur ist auf Papier: Rechtschreibhilfe und Autokorrektur aus, soweit der Browser das zulässt */
function noAuto(el){
  el.setAttribute("spellcheck", "false");
  el.setAttribute("autocorrect", "off");
  el.setAttribute("autocomplete", "off");
  if(el.tagName === "INPUT") el.setAttribute("autocapitalize", "off");
}

/* ---------- WORTSCHATZ ---------- */
function renderVocab(main, dock){
  const it = ses.vq[ses.vi];
  const lastItem = ses.vi === ses.vq.length - 1;
  const nextLabel = !lastItem ? "Nächste Aufgabe" : ses.mode === "vocab" ? "Fertig" : "Weiter zum Schreiben";
  /* Sätze und Wörter teilen sich eine Warteschlange, ses.step zeigt, in welchem Teil du bist */

  const head = document.createElement("div");
  head.className = "stack tight";
  const hint = {
    def:  "Schreib einen ganzen Satz auf Englisch. Ein einzelnes Synonym zählt in der Klausur nicht. Muster: Oberbegriff + that/who …",
    find: "Welcher Begriff ist gemeint? Achte auf die Wortart.",
    wf:   "Bilde aus dem Wort in Großbuchstaben das Wort, das in die Lücke passt. Erst die Wortart klären, dann schreiben.",
    tr:   "Schreib den Satz auf Englisch. Überleg zuerst, welche Form verlangt ist: welcher Conditional, Relativsatz oder Passiv?",
    fs:   ""
  }[it.kind];
  if(it.kind === "fs"){
    const fsQ = ses.vq.filter(x => x.kind === "fs"), pat = FOCUS.patterns[it.f.m];
    head.innerHTML = `<span class="label accent">Fokus Drill ${FOCUS.drill} · ${esc(pat.name)} · ${fsQ.indexOf(it) + 1} von ${fsQ.length}</span>
      <p class="muted">Schreib den Satz auf Englisch. Fehlende Wörter auf Deutsch in Klammern. Vor dem Aufdecken einmal nur auf das Muster lesen: ${pat.check}</p>`;
  } else {
    const n = ses.vq.filter(x => x.kind !== "fs"), off = ses.vq.length - n.length;
    head.innerHTML = `<span class="label accent">${esc(VKIND[it.kind].label)} · ${ses.vi - off + 1} von ${n.length}</span>
      <p class="muted">${esc(hint)}</p>`;
  }
  main.appendChild(head);

  const card = document.createElement("div");
  card.className = "card";
  if(it.kind === "def"){
    card.innerHTML = `<span class="label">Define in English</span>
      <p class="en big">${esc(it.v.pos === "verb" ? "to " + it.v.w : it.v.w)}</p>
      <p class="small">${esc(it.v.pos)}</p>`;
  } else if(it.kind === "find"){
    card.innerHTML = `<span class="label">Which term is defined? · ${esc(it.v.pos)}</span>
      <p class="en">${esc(it.v.d)}</p>`;
  } else if(it.kind === "wf"){
    const parts = it.x.s.split("___");
    const mid = ses.shown ? `<span class="ins">${esc(it.x.a[0])}</span>` : `<span class="gap"></span>`;
    card.innerHTML = `<span class="label">Word formation</span>
      <p class="en">${esc(parts[0])}${mid}${esc(parts[1] || "")}</p>
      <p class="small" style="margin-top:8px">Ausgangswort: <strong style="letter-spacing:.06em">${esc(it.x.b.toUpperCase())}</strong></p>`;
  } else {
    card.innerHTML = `<span class="label">Deutsch</span><p class="de" style="font-size:1.05rem;font-weight:600">${esc(it.kind === "fs" ? it.f.de : it.t.de)}</p>`;
  }
  main.appendChild(card);

  const long = it.kind === "def" || it.kind === "tr" || it.kind === "fs";
  const field = document.createElement(long ? "textarea" : "input");
  if(long){ field.rows = 3; } else { field.type = "text"; field.className = "answer"; field.enterKeyHint = "done"; }
  field.placeholder = it.kind === "def" ? "A … is a … that …" : (it.kind === "tr" || it.kind === "fs") ? "Deine englische Version …" : "Deine Antwort …";
  field.value = ses.answer || "";
  field.readOnly = ses.shown;
  noAuto(field);
  main.appendChild(field);

  /* --- selbst einschätzen: Definition und Übersetzung --- */
  if(long){
    field.addEventListener("input", () => { ses.answer = field.value; });
    if(!ses.shown){
      dock.appendChild(btn("Lösung zeigen", "primary", () => { ses.shown = true; render(); }));
      return;
    }
    const rev = document.createElement("div");
    rev.className = "card marked stack tight";
    rev.innerHTML = it.kind === "def"
      ? `<span class="label right">Musterdefinition</span>
         <p class="en">${esc(it.v.m)}</p>
         <p class="muted" style="margin-top:8px"><strong>Muss drin sein:</strong> ${it.v.k}</p>
         <p class="small">Deutsch: ${esc(it.v.de)}</p>`
      : it.kind === "fs"
      ? `<span class="label right">Musterlösung</span>
         <p class="en">${esc(it.f.en)}</p>
         <p class="muted" style="margin-top:8px">${it.f.tip}</p>
         <p class="small">${it.f.own ? "Dein Satz aus dem Drill · " : ""}Muster: ${esc(FOCUS.patterns[it.f.m].name)}</p>`
      : `<span class="label right">Musterlösung</span>
         <p class="en">${esc(it.t.en)}</p>
         <p class="muted" style="margin-top:8px">${it.t.tip}</p>
         <p class="small">Aus dem Thema: ${esc(it.unit)}</p>`;
    main.appendChild(rev);

    const q = document.createElement("p");
    q.className = "small";
    q.style.textAlign = "center";
    q.textContent = it.kind === "def" ? "Ehrlich sein — stand der Kern in deinem Satz?"
      : it.kind === "fs" ? "Ehrlich sein — saß das Muster? Andere Fehler zählen hier nicht." : "Ehrlich sein — hattest du das?";
    main.appendChild(q);

    dock.appendChild(btn("Daneben", "no", () => advVocab(false)));
    dock.appendChild(btn("Hatte ich", "ok", () => advVocab(true)));
    return;
  }

  /* --- automatisch geprüft: Begriff finden und Wortbildung --- */
  if(!ses.shown){
    const check = () => {
      if(!field.value.trim()) return;
      ses.answer = field.value;
      ses.vok = accepts(it, field.value);
      ses.shown = true; render();
    };
    const b = btn("Prüfen", "primary", check);
    b.disabled = !field.value.trim();
    field.addEventListener("input", () => { ses.answer = field.value; b.disabled = !field.value.trim(); });
    field.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); check(); } });
    dock.appendChild(b);
    return;
  }
  const hit = ses.vok;
  const right = it.kind === "wf" ? it.x.a[0] : it.v.w;
  const rev = document.createElement("div");
  rev.className = "card stack tight";
  rev.style.borderColor = hit ? "var(--right)" : "var(--line)";
  rev.innerHTML = `<span class="label ${hit ? "right" : "wrong"}">${hit ? "Richtig" : "Gesucht war"}</span>
    <p class="en">${hit ? "" : `<span class="strike">${esc(ses.answer.trim())}</span> `}<span class="ins">${esc(right)}</span></p>` +
    (it.kind === "wf"
      ? `<p class="muted" style="margin-top:8px">${it.x.why}</p>`
      : `<p class="muted" style="margin-top:8px">Deutsch: ${esc(it.v.de)}</p>`);
  main.appendChild(rev);
  dock.appendChild(btn(nextLabel, "primary", () => advVocab(hit)));
}

function renderWrite(main, dock){
  const u = ses.u;
  const short = ses.mode === "short";
  const target = short ? 35 : 70;
  if(!ses.wt0) ses.wt0 = Date.now();

  const head = document.createElement("div");
  head.className = "card raised stack tight";
  head.innerHTML = `<span class="label accent">Selbst schreiben${short ? " · Kurzrunde" : ""}</span>
    <h2>${esc(short ? u.wr.short : u.wr.p)}</h2>
    <p class="muted">${short ? "Drei Sätze reichen. Fehler sind egal — Hauptsache, es steht da." : "Ungefähr " + target + " Wörter. Nicht schön machen, einfach schreiben."}</p>`;
  main.appendChild(head);

  const ph = document.createElement("details");
  ph.className = "entry";
  ph.open = true;
  ph.innerHTML = `<summary><span class="etitle">Nützliche Wendungen</span><span class="edate">${u.wr.ph.length}</span></summary>
    <div class="ebody"><ul class="phrases">${u.wr.ph.map((p,i) => `<li><em>${i+1}</em><span>${esc(p)}</span></li>`).join("")}</ul></div>`;
  main.appendChild(ph);

  const ta = document.createElement("textarea");
  ta.rows = short ? 6 : 9;
  ta.placeholder = "Write in English …";
  ta.value = ses.text;
  noAuto(ta);
  main.appendChild(ta);

  const row = document.createElement("div");
  row.className = "meterrow";
  row.innerHTML = `<div class="meter"><i style="width:0"></i></div><span class="count"><strong>0</strong> / ${target} Wörter</span>`;
  main.appendChild(row);

  const bar = row.querySelector("i"), cnt = row.querySelector("strong");
  const upd = () => {
    ses.text = ta.value;
    const w = words(ta.value);
    cnt.textContent = w;
    bar.style.width = Math.min(100, (w / target) * 100) + "%";
  };
  ta.addEventListener("input", upd);
  upd();

  if(!short){
    const ch = document.createElement("div");
    ch.className = "card";
    ch.innerHTML = `<span class="label">Bevor du abschickst — kurz drüberlesen</span>
      <ul class="checks">${u.wr.ck.map(c => `<li>${esc(c)}</li>`).join("")}</ul>`;
    main.appendChild(ch);
  }

  dock.appendChild(btn("Fertig", "primary", () => { ses.text = ta.value; finishSession(); }));
}

/* ---------- DONE ---------- */
function resultList(){
  const c = document.createElement("div");
  c.className = "card stack tight";
  c.innerHTML = `<span class="label">${ses.vres.some(r => r.kind === "fs") ? "Sätze und Wortschatz" : "Wortschatz"} in dieser Runde</span>
    <ul class="results">${ses.vres.map(r =>
      `<li class="${r.ok ? "hit" : "miss"}"><b>${r.ok ? "✓" : "✗"}</b><span>${esc(r.label)}<small>${esc(VKIND[r.kind].label)}${r.ok ? "" : " · kommt beim nächsten Mal wieder"}</small></span></li>`
    ).join("")}</ul>`;
  return c;
}
function defsNote(){
  const n = document.createElement("div");
  n.className = "note";
  n.innerHTML = `<b>Definitionen prüfen lassen:</b> Der Knopf unten kopiert deine Definitionen mit einer fertigen Anweisung. In Claude einfügen — du siehst, ob der Kern getroffen ist und wo die Sprache hakt.`;
  return n;
}

function renderDoneVocab(main, dock){
  const hero = document.createElement("div");
  hero.className = "hero";
  hero.innerHTML = `
    <div class="stack tight">
      <span class="label accent">Geschafft</span>
      <h1>${esc(ses.vkind ? VKIND[ses.vkind].label : "Klausur-Mix")}</h1>
    </div>
    <div class="streakrow">
      <div class="stat hot"><b>${vocOkCount()}/${ses.vres.length}</b><span>Richtig</span></div>
      <div class="stat"><b>${mmss(ses.secs)}</b><span>Gebraucht</span></div>
    </div>`;
  main.appendChild(hero);
  main.appendChild(resultList());

  const home = () => { ses = null; view = "home"; render(); window.scrollTo({top:0,behavior:"instant"}); };
  if(ses.defs.length){
    main.appendChild(defsNote());
    dock.appendChild(btn("Für Claude kopieren", "primary", () => copy(defsPrompt(ses.defs), "Kopiert — in Claude einfügen")));
    const b = btn("Fertig", "ghost", home);
    b.style.flex = "0 0 auto";
    dock.appendChild(b);
  } else dock.appendChild(btn("Zum Start", "primary", home));
}

function renderDone(main, dock){
  if(ses.mode === "vocab") return renderDoneVocab(main, dock);
  const u = ses.u, short = ses.mode === "short";

  const hero = document.createElement("div");
  hero.className = "hero";
  hero.innerHTML = `
    <div class="stack tight">
      <span class="label accent">Geschafft</span>
      <h1>${esc(u.t)}</h1>
    </div>
    <div class="streakrow">
      ${short ? "" : `<div class="stat hot"><b>${ses.fixOk + ses.trOk}/${u.fix.length + u.tr.length}</b><span>Richtig</span></div>`}
      <div class="stat"><b>${ses.wcount}</b><span>Wörter</span></div>
      <div class="stat"><b>${mmss(ses.secs)}</b><span>Gebraucht</span></div>
    </div>
    ${short ? "" : `<p class="muted">Fehler gefunden: <strong>${ses.fixOk} von ${u.fix.length}</strong> · Übersetzt: <strong>${ses.trOk} von ${u.tr.length}</strong>${ses.vres.length ? ` · Wortschatz: <strong>${vocOkCount()} von ${ses.vres.length}</strong>` : ""}</p>`}`;
  main.appendChild(hero);
  if(ses.vres.length) main.appendChild(resultList());

  if(ses.wcount === 0 && ses.defs.length){
    main.appendChild(defsNote());
    dock.appendChild(btn("Für Claude kopieren", "primary", () => copy(defsPrompt(ses.defs), "Kopiert — in Claude einfügen")));
  }
  const canCopy = ses.wcount > 0 || ses.defs.length > 0;

  if(ses.wcount > 0){
    const c = document.createElement("div");
    c.className = "card marked stack tight";
    c.innerHTML = `<span class="label">Dein Text</span>
      <p class="en" style="white-space:pre-wrap">${esc(ses.text.trim())}</p>`;
    main.appendChild(c);

    const n = document.createElement("div");
    n.className = "note";
    n.innerHTML = `<b>Korrektur holen:</b> Der Knopf unten kopiert deinen Text${ses.defs.length ? " und deine Definition" : ""} zusammen mit einer fertigen Anweisung. In die Claude-App einfügen, abschicken — du bekommst Korrektur, die drei wichtigsten Fehler und eine Regel für morgen. Dauert eine Minute.`;
    main.appendChild(n);

    dock.appendChild(btn("Für Claude kopieren", "primary", () => {
      copy(claudePrompt(u, short ? u.wr.short : u.wr.p, ses.text, ses.defs), "Kopiert — in Claude einfügen");
    }));
  }
  const b = btn(canCopy ? "Fertig" : "Zum Start", canCopy ? "ghost" : "primary", () => {
    ses = null; view = "home"; render(); window.scrollTo({top:0,behavior:"instant"});
  });
  if(canCopy) b.style.flex = "0 0 auto";
  dock.appendChild(b);
}

/* ---------- TOPICS ---------- */
function renderTopics(main, dock){
  const next = pickNext();

  const intro = document.createElement("p");
  intro.className = "small";
  intro.textContent = "Tipp auf ein Thema, um direkt damit anzufangen. Die Zahl zeigt, wie gut es bisher sitzt.";
  main.appendChild(intro);

  const wrap = document.createElement("div");
  wrap.className = "topics";

  BLOCKS.forEach(bl => {
    const h = document.createElement("div");
    h.className = "blockhead";
    h.textContent = bl.name;
    wrap.appendChild(h);

    for(let i = bl.from - 1; i <= bl.to - 1 && i < UNITS.length; i++){
      const u = UNITS[i], s = strength(i);
      const pct = s === null ? null : Math.round(s * 100);
      const cls = pct === null ? "" : pct >= 80 ? "good" : pct >= 55 ? "mid" : "low";
      const b = document.createElement("button");
      b.className = "topic" + (i === next ? " cur" : "");
      b.innerHTML = `<span class="tt">${esc(u.t)}<small>${esc(u.g.split(/[.!?]/)[0])}.</small></span>` +
        `<span class="str ${cls}">${pct === null ? "neu" : pct + "%"}</span>`;
      b.addEventListener("click", () => startSession("full", i));
      wrap.appendChild(b);
    }
  });
  /* Wortschatz: eine Zeile je Aufgabenart, Tipp startet sechs Aufgaben dieser Art */
  const vh = document.createElement("div");
  vh.className = "blockhead";
  vh.textContent = "Wortschatz & Klausurteile";
  wrap.appendChild(vh);
  const vsub = {
    def:  "Begriffe in einem ganzen Satz erklären",
    find: "Zur Definition den Begriff nennen",
    wf:   "Aus dem Ausgangswort die passende Wortart bilden",
    tr:   "Conditionals, Relativsätze und Passiv durcheinander",
    fs:   "Fokus Drill " + FOCUS.drill + ": " + FOCUS.active.map(m => FOCUS.patterns[m].name).join(", ")
  };
  Object.keys(VKIND).forEach(kind => {
    const st = kindStat(kind);
    const pct = st.n ? Math.round(st.ok / st.n * 100) : null;
    const cls = pct === null ? "" : pct >= 80 ? "good" : pct >= 55 ? "mid" : "low";
    const b = document.createElement("button");
    b.className = "topic";
    b.innerHTML = `<span class="tt">${esc(VKIND[kind].label)}<small>${esc(vsub[kind])} · ${st.seen} von ${st.all} gesehen</small></span>` +
      `<span class="str ${cls}">${pct === null ? "neu" : pct + "%"}</span>`;
    b.addEventListener("click", () => startVocab(kind));
    wrap.appendChild(b);
  });
  main.appendChild(wrap);

  if(S.stats.fixN + S.stats.trN > 0){
    const sum = document.createElement("p");
    sum.className = "small";
    sum.style.textAlign = "center";
    sum.textContent = "Insgesamt " + Math.round((S.stats.fixOk + S.stats.trOk) / (S.stats.fixN + S.stats.trN) * 100) +
      " % richtig · " + S.stats.words + " Wörter geschrieben";
    main.appendChild(sum);
  }

  const bk = btn("Fortschritt sichern oder zurückholen", "ghost", () => { view = "backup"; render(); });
  bk.style.minHeight = "42px";
  bk.style.fontSize = ".82rem";
  main.appendChild(bk);

  if(S.stats.rounds > 0 || S.stats.vocN > 0){
    const reset = btn("Alles zurücksetzen", "ghost", () => {
      if(confirm("Wirklich alles löschen — Statistik und alle gespeicherten Texte?")){
        S = structuredClone(BLANK); save(); view = "home"; render();
      }
    });
    reset.style.minHeight = "40px";
    reset.style.fontSize = ".8rem";
    main.appendChild(reset);
  }

  dock.appendChild(btn("Zurück", "ghost", () => { view = "home"; render(); }));
}

/* ---------- ARCHIVE ---------- */
function renderArchive(main, dock){
  if(!S.texts.length){
    const c = document.createElement("div");
    c.className = "card";
    c.innerHTML = `<span class="label">Noch leer</span><p class="muted">Alles, was du im Schreibteil tippst, landet hier — nur auf diesem Gerät, nichts wird hochgeladen. Nach zwei Wochen siehst du hier, wie sich deine Sätze verändern.</p>`;
    main.appendChild(c);
  } else {
    const info = document.createElement("p");
    info.className = "small";
    info.textContent = S.texts.length + (S.texts.length === 1 ? " Text · " : " Texte · ") +
      S.texts.reduce((a,t) => a + t.w, 0) + " Wörter · gespeichert nur auf diesem Gerät";
    main.appendChild(info);

    S.texts.forEach((t, i) => {
      const d = document.createElement("details");
      d.className = "entry";
      d.innerHTML = `<summary><span class="etitle">${esc(t.u)}</span><span class="edate">${esc(t.d.slice(8,10) + "." + t.d.slice(5,7) + ".")} · ${t.w} W.</span></summary>
        <div class="ebody">
          <p class="eprompt">${esc(t.p)}</p>
          <div class="etext">${esc(t.x)}</div>
        </div>`;
      const b = btn("Für Claude kopieren", "ghost", () => {
        copy(claudePrompt({t:t.u}, t.p, t.x), "Kopiert — in Claude einfügen");
      });
      b.style.minHeight = "42px";
      d.querySelector(".ebody").appendChild(b);
      main.appendChild(d);
    });
  }

  dock.appendChild(btn("Zurück", "ghost", () => { view = "home"; render(); }));
  if(S.texts.length){
    dock.appendChild(btn("Alles kopieren", "", () => {
      copy(S.texts.map(t => `=== ${t.d} — ${t.u} ===\n${t.p}\n\n${t.x}`).join("\n\n\n"), "Alle Texte kopiert");
    }));
  }
}

/* ---------- SICHERUNG ----------
   Eine Datei überlebt das Löschen von Browserdaten — localStorage nicht.
   Deshalb ist der Datei-Weg hier der Hauptweg, Kopieren nur der Rückfall. */
function applyBackup(raw){
  let data = null;
  try{ data = JSON.parse(String(raw).trim()); }catch(e){}
  if(!data || typeof data !== "object" || !data.stats || typeof data.stats.rounds !== "number"){
    toast("Das ist keine gültige Sicherung"); return false;
  }
  const n = Array.isArray(data.texts) ? data.texts.length : 0;
  if(!confirm("Alles überschreiben und " + n + " gesicherte Texte einspielen?")) return false;
  S = Object.assign(structuredClone(BLANK), data, {
    stats: Object.assign(structuredClone(BLANK.stats), data.stats)
  });
  save(); toast("Wiederhergestellt"); view = "home"; render();
  return true;
}

function backupName(){
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return `daily-english-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}.json`;
}

function saveBackupFile(){
  const dl = window.claude && window.claude.downloads;
  if(!dl){ toast("Datei speichern geht hier nicht"); return; }
  dl.save({filename: backupName(), data: JSON.stringify(S)}).then(
    () => toast("Als Datei gespeichert"),
    err => {
      const c = err && err.code;
      if(c === "declined")           toast("Abgebrochen");
      else if(c === "rate_limited")  toast("Kurz warten, dann nochmal");
      else                           toast("Ging nicht — nimm „Text kopieren\"");
    }
  );
}

function renderBackup(main, dock){
  const canFile = !!(window.claude && window.claude.downloads);

  const a = document.createElement("div");
  a.className = "card stack tight";
  a.innerHTML = `<span class="label accent">Sichern</span>
    <p class="muted">Dein Fortschritt liegt im Browser. Wenn du Browserdaten löschst, ist er weg — <strong>eine gesicherte Datei nicht</strong>, die liegt in deinen Downloads.</p>
    <p class="small">Einmal im Monat reicht. Enthält Texte und Trefferquoten.</p>`;
  main.appendChild(a);

  if(canFile){
    const bf = btn("Als Datei speichern", "primary", saveBackupFile);
    bf.style.minHeight = "46px";
    main.appendChild(bf);
  }
  const bc = btn(canFile ? "Stattdessen Text kopieren" : "Sicherung kopieren", "", () => copy(JSON.stringify(S), "Sicherung kopiert"));
  bc.style.minHeight = "44px";
  main.appendChild(bc);

  const b = document.createElement("div");
  b.className = "card stack tight";
  b.innerHTML = `<span class="label wrong">Zurückholen</span>
    <p class="muted">Überschreibt alles, was gerade gespeichert ist.</p>`;
  main.appendChild(b);

  const file = document.createElement("input");
  file.type = "file";
  file.accept = ".json,application/json";
  file.style.display = "none";
  file.addEventListener("change", () => {
    const f = file.files && file.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = () => applyBackup(r.result);
    r.onerror = () => toast("Datei ließ sich nicht lesen");
    r.readAsText(f);
    file.value = "";
  });
  main.appendChild(file);

  const bfile = btn("Sicherungsdatei wählen", "primary", () => file.click());
  bfile.style.minHeight = "46px";
  main.appendChild(bfile);

  const inp = document.createElement("textarea");
  inp.className = "copybox"; inp.rows = 4;
  inp.placeholder = "… oder gesicherten Text hier einfügen";
  main.appendChild(inp);

  const b2 = btn("Aus Text wiederherstellen", "", () => applyBackup(inp.value));
  b2.style.minHeight = "44px";
  main.appendChild(b2);

  dock.appendChild(btn("Zurück", "ghost", () => { view = "topics"; render(); }));
}

/* ---------- MANUAL COPY ---------- */
function renderManual(main, dock){
  const c = document.createElement("div");
  c.className = "card stack tight";
  c.innerHTML = `<span class="label">Automatisches Kopieren ging nicht</span>
    <p class="muted">Text antippen, alles markieren, kopieren — dann in Claude einfügen.</p>`;
  main.appendChild(c);
  const ta = document.createElement("textarea");
  ta.className = "copybox";
  ta.rows = 14;
  ta.value = manualText;
  ta.readOnly = true;
  ta.addEventListener("focus", () => ta.select());
  main.appendChild(ta);
  dock.appendChild(btn("Zurück", "ghost", () => { view = ses ? "done" : "home"; render(); }));
}

  if(view === "session"){
    if(!confirm("Runde abbrechen? Der Fortschritt dieser Runde geht verloren.")) return;
  }
  stopClock(); ses = null; view = "home"; render();
});

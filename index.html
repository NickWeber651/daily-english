/* ============================================================
   SESSION
   ============================================================ */
const STEPS = [
  {k:"rule",  label:"Regel"},
  {k:"fix",   label:"Fehler"},
  {k:"trans", label:"Übersetzen"},
  {k:"write", label:"Schreiben"}
];

function startSession(mode, unitIdx){
  const idx = (typeof unitIdx === "number" ? unitIdx : pickNext()) % UNITS.length;
  ses = {
    mode, idx, u: UNITS[idx],
    step: mode === "short" ? "write" : "rule",
    fi:0, ti:0, fixOk:0, trOk:0,
    sel:null, shown:false,
    text:"", t0:Date.now(), wt0:null
  };
  view = "session";
  startClock();
  render();
}
/* ---------- Sprechen ---------- */
let speakTimer = null;
const PREP = 30, TALK = 120;

function pickTopic(){
  let best = 0, least = Infinity;
  for(let i = 0; i < TOPICS.length; i++){
    const n = S.spoken[TOPICS[i].q] || 0;
    if(n < least){ least = n; best = i; }
  }
  return best;
}
function startSpeak(topicIdx){
  const i = typeof topicIdx === "number" ? topicIdx : pickTopic();
  ses = {mode:"speak", ti:i, topic:TOPICS[i], phase:"ready", left:PREP, checks:[false,false,false], t0:Date.now()};
  view = "speak";
  stopSpeak();
  render();
}
function stopSpeak(){ if(speakTimer){ clearInterval(speakTimer); speakTimer = null; } }
function runPhase(phase){
  ses.phase = phase;
  ses.left = phase === "prep" ? PREP : TALK;
  render();
  stopSpeak();
  speakTimer = setInterval(() => {
    ses.left--;
    const t = $("bigTimer"), r = $("ringFill");
    if(!t){ stopSpeak(); return; }
    t.textContent = mmss(Math.max(0, ses.left));
    if(r) r.style.width = Math.max(0, ses.left / (ses.phase === "prep" ? PREP : TALK) * 100) + "%";
    if(ses.left <= 0){
      stopSpeak();
      if(ses.phase === "prep") runPhase("talk");
      else { ses.phase = "check"; render(); }
    }
  }, 1000);
}
function finishSpeak(){
  stopSpeak();
  S.spoken[ses.topic.q] = (S.spoken[ses.topic.q] || 0) + 1;
  S.stats.speakRounds += 1;
  S.stats.speakSeconds += TALK;
  save();
  ses = null; view = "home"; render();
  window.scrollTo({top:0, behavior:"instant"});
}

function startClock(){
  stopClock();
  tick = setInterval(() => {
    if(!ses) return;
    const c = $("clock");
    if(c) c.textContent = mmss(Math.floor((Date.now() - ses.t0)/1000));
  }, 1000);
}
function stopClock(){ if(tick){ clearInterval(tick); tick = null; } }

function nextStep(){
  const order = ["rule","fix","trans","write"];
  const i = order.indexOf(ses.step);
  ses.step = order[i+1];
  ses.sel = null; ses.shown = false;
  if(ses.step === "write") ses.wt0 = Date.now();
  render();
  window.scrollTo({top:0, behavior:"instant"});
}

function finishSession(){
  const secs = Math.floor((Date.now() - ses.t0)/1000);
  const w = words(ses.text);
  const d = today();

  S.stats.words += w;
  S.stats.seconds += secs;
  S.stats.rounds += 1;

  const t = topicStat(ses.idx);
  t.n += 1;
  if(ses.mode !== "short"){
    t.ok += ses.fixOk + ses.trOk;
    t.total += ses.u.fix.length + ses.u.tr.length;
    S.stats.fixOk += ses.fixOk; S.stats.fixN += ses.u.fix.length;
    S.stats.trOk  += ses.trOk;  S.stats.trN  += ses.u.tr.length;
  }
  S.topics[ses.u.t] = t;

  if(w > 0){
    S.texts.unshift({d, u:ses.u.t, p:ses.u.wr.p, x:ses.text.trim(), w});
    if(S.texts.length > 400) S.texts.length = 400;
  }
  save();

  ses.secs = secs; ses.wcount = w;
  stopClock();
  view = "done";
  render();
  window.scrollTo({top:0, behavior:"instant"});
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  const main = $("main"), dock = $("dock"), rail = $("rail");
  const back = $("backBtn"), clock = $("clock"), tag = $("dayTag"), title = $("topTitle");

  main.innerHTML = ""; dock.innerHTML = ""; rail.innerHTML = "";
  rail.hidden = true; back.hidden = (view === "home"); clock.hidden = (view !== "session");

  const inSession = (view === "session" || view === "done") && ses;
  tag.hidden = !(inSession || view === "speak");
  if(inSession) tag.textContent = areaOf(ses.idx);
  else if(view === "speak") tag.textContent = ses.topic.a;

  if(view === "home")        { title.textContent = "Daily English"; renderHome(main, dock); }
  else if(view === "speak")  { title.textContent = "Sprechen"; renderSpeak(main, dock); }
  else if(view === "session"){ title.textContent = ses.u.t; renderRail(rail); renderSession(main, dock); }
  else if(view === "done")   { title.textContent = ses.u.t; renderDone(main, dock); }
  else if(view === "topics") { title.textContent = "Themen"; renderTopics(main, dock); }
  else if(view === "archive"){ title.textContent = "Meine Texte"; renderArchive(main, dock); }
  else if(view === "backup") { title.textContent = "Sicherung"; renderBackup(main, dock); }
  else if(view === "manual") { title.textContent = "Zum Kopieren"; renderManual(main, dock); }
}

function renderRail(rail){
  if(ses.mode === "short") return;
  rail.hidden = false;
  const cur = STEPS.findIndex(s => s.k === ses.step);
  rail.innerHTML = STEPS.map((s,i) =>
    `<div class="seg ${i < cur ? "done" : ""} ${i === cur ? "now" : ""}">
       <div class="seg-bar"></div><span class="seg-label">${s.label}</span>
     </div>`).join("");
}

function btn(label, cls, fn){
  const b = document.createElement("button");
  b.className = "btn " + (cls || "");
  b.textContent = label;
  b.addEventListener("click", fn);
  return b;
}

/* ---------- HOME ---------- */
function renderHome(main, dock){
  const idx = pickNext();
  const u = UNITS[idx];

  const hero = document.createElement("div");
  hero.className = "hero";
  hero.innerHTML = `
    <div class="stack tight">
      <span class="label accent">${esc(blockOf(idx).name)}</span>
      <h1>${esc(u.t)}</h1>
      <p class="muted">${esc(u.g)}</p>
    </div>
    <p class="small">Regel ansehen · Fehler finden · übersetzen · selbst schreiben. Die App sucht das Thema aus — du drückst nur Start.</p>`;
  main.appendChild(hero);

  const links = document.createElement("div");
  links.className = "stack tight";
  links.appendChild(rowlink("Nur schreiben", "3 Minuten, direkt zum Schreibteil", () => startSession("short")));
  links.appendChild(rowlink("Themen", "Lieber selbst eins aussuchen", () => { view = "topics"; render(); }));
  links.appendChild(rowlink("Meine Texte", S.texts.length ? S.texts.length + (S.texts.length === 1 ? " Text gespeichert" : " Texte gespeichert") : "noch nichts geschrieben", () => { view = "archive"; render(); }));
  main.appendChild(links);

  if(S.stats.rounds > 0 || S.stats.speakRounds > 0){
    const parts = [];
    if(S.stats.rounds) parts.push(S.stats.rounds + (S.stats.rounds === 1 ? " Runde" : " Runden") + " · " + S.stats.words + " Wörter geschrieben");
    if(S.stats.speakRounds) parts.push(S.stats.speakRounds + "× gesprochen · " + Math.round(S.stats.speakSeconds/60) + " Min");
    const sum = document.createElement("p");
    sum.className = "small";
    sum.style.textAlign = "center";
    sum.textContent = parts.join(" · ");
    main.appendChild(sum);
  }

  dock.appendChild(btn("Start — 10 Minuten", "primary", () => startSession("full")));
  const s = btn("Sprechen", "", () => startSpeak());
  s.style.flex = "0 0 auto";
  dock.appendChild(s);
}

function rowlink(title, sub, fn){
  const b = document.createElement("button");
  b.className = "rowlink";
  b.innerHTML = `<span>${esc(title)}<span class="sub">${esc(sub)}</span></span><span class="chev" aria-hidden="true">›</span>`;
  b.addEventListener("click", fn);
  return b;
}

/* ---------- SESSION ---------- */
function renderSession(main, dock){
  if(ses.step === "rule")  return renderRule(main, dock);
  if(ses.step === "fix")   return renderFix(main, dock);
  if(ses.step === "trans") return renderTrans(main, dock);
  if(ses.step === "write") return renderWrite(main, dock);
}

function renderRule(main, dock){
  const u = ses.u;
  const c = document.createElement("div");
  c.className = "card raised stack";
  c.innerHTML = `
    <span class="label accent">Regel</span>
    <h2>${esc(u.t)}</h2>
    <p class="muted">${esc(u.g)}</p>`;
  main.appendChild(c);

  const ex = document.createElement("div");
  ex.className = "card marked stack tight";
  ex.innerHTML = `<span class="label">So sieht's aus</span>` +
    u.ex.map(e => `<p class="en">${esc(e)}</p>`).join("");
  main.appendChild(ex);

  const t = document.createElement("div");
  t.className = "trap";
  t.innerHTML = `<span class="label wrong">Typischer Deutsch-Fehler</span>${u.err}`;
  main.appendChild(t);

  dock.appendChild(btn("Verstanden — weiter", "primary", nextStep));
}

function renderFix(main, dock){
  const u = ses.u, it = u.fix[ses.fi];

  const head = document.createElement("div");
  head.className = "stack tight";
  head.innerHTML = `<span class="label accent">Fehler finden · ${ses.fi + 1} von ${u.fix.length}</span>
    <p class="muted">Tipp auf das Wort, das falsch ist.</p>`;
  main.appendChild(head);

  const card = document.createElement("div");
  card.className = "card marked";
  const box = document.createElement("div");
  box.className = "words";
  it.s.split(" ").forEach((tok, i) => {
    const b = document.createElement("button");
    b.className = "w";
    b.textContent = tok;
    if(ses.shown){
      b.classList.add("locked");
      if(i === it.i){
        b.classList.add("miss");
        if(ses.sel === i) b.classList.add("found");
      } else if(ses.sel === i) b.classList.add("picked");
    } else if(ses.sel === i) b.classList.add("sel");
    if(!ses.shown) b.addEventListener("click", () => { ses.sel = i; render(); });
    box.appendChild(b);
  });
  card.appendChild(box);
  main.appendChild(card);

  if(ses.shown){
    const hit = ses.sel === it.i;
    const rev = document.createElement("div");
    rev.className = "card stack tight";
    rev.style.borderColor = hit ? "var(--right)" : "var(--line)";
    rev.innerHTML = `
      <span class="label ${hit ? "right" : "wrong"}">${hit ? "Richtig erkannt" : "Der Fehler saß hier"}</span>
      <p class="en"><span class="strike">${esc(it.s.split(" ")[it.i])}</span> <span class="ins">${esc(
        it.mv ? "steht an der falschen Stelle" : it.fix === "" ? "gehört gestrichen" : it.fix
      )}</span></p>
      <p class="en" style="margin-top:6px">${esc(corrected(it))}</p>
      <p class="muted" style="margin-top:8px">${it.why}</p>`;
    main.appendChild(rev);
  }

  if(!ses.shown){
    const b = btn("Prüfen", "primary", () => {
      ses.shown = true;
      if(ses.sel === it.i) ses.fixOk++;
      render();
    });
    b.disabled = ses.sel === null;
    dock.appendChild(b);
  } else {
    const last = ses.fi === u.fix.length - 1;
    dock.appendChild(btn(last ? "Weiter zum Übersetzen" : "Nächster Satz", "primary", () => {
      if(last) nextStep();
      else { ses.fi++; ses.sel = null; ses.shown = false; render(); window.scrollTo({top:0,behavior:"instant"}); }
    }));
  }
}

function renderTrans(main, dock){
  const u = ses.u, it = u.tr[ses.ti];

  const head = document.createElement("div");
  head.className = "stack tight";
  head.innerHTML = `<span class="label accent">Übersetzen · ${ses.ti + 1} von ${u.tr.length}</span>
    <p class="muted">Schreib den Satz auf Englisch. Nicht nachschlagen — raten ist Teil der Übung.</p>`;
  main.appendChild(head);

  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<span class="label">Deutsch</span><p class="de" style="font-size:1.05rem;font-weight:600">${esc(it.de)}</p>`;
  main.appendChild(card);

  const ta = document.createElement("textarea");
  ta.rows = 3;
  ta.placeholder = "Deine englische Version …";
  ta.value = ses.answer || "";
  ta.readOnly = ses.shown;
  ta.addEventListener("input", () => { ses.answer = ta.value; });
  main.appendChild(ta);

  if(ses.shown){
    const rev = document.createElement("div");
    rev.className = "card marked stack tight";
    rev.innerHTML = `<span class="label right">Musterlösung</span>
      <p class="en">${esc(it.en)}</p>
      <p class="muted" style="margin-top:8px">${it.tip}</p>`;
    main.appendChild(rev);

    const q = document.createElement("p");
    q.className = "small";
    q.style.textAlign = "center";
    q.textContent = "Ehrlich sein — hattest du das?";
    main.appendChild(q);

    dock.appendChild(btn("Daneben", "no", () => advTrans(false)));
    dock.appendChild(btn("Hatte ich", "ok", () => advTrans(true)));
  } else {
    dock.appendChild(btn("Lösung zeigen", "primary", () => {
      ses.shown = true; render();
    }));
  }
}
function advTrans(ok){
  if(ok) ses.trOk++;
  const last = ses.ti === ses.u.tr.length - 1;
  ses.answer = ""; ses.shown = false;
  if(last) nextStep();
  else { ses.ti++; render(); window.scrollTo({top:0,behavior:"instant"}); }
}

function renderWrite(main, dock){
  const u = ses.u;
  const short = ses.mode === "short";
  const target = short ? 35 : 70;
  if(!ses.wt0) ses.wt0 = Date.now();

  const head = document.createElement("div");
  head.className = "card raised stack tight";
  head.innerHTML = `<span class="label accent">Selbst schreiben${short ? " · Kurzrunde" : ""}</span>
    <h2>${esc(short ? u.wr.short : u.wr.p)}</h2>
    <p class="muted">${short ? "Drei Sätze reichen. Fehler sind egal — Hauptsache, es steht da." : "Ungefähr " + target + " Wörter. Nicht schön machen, einfach schreiben."}</p>`;
  main.appendChild(head);

  const ph = document.createElement("details");
  ph.className = "entry";
  ph.open = true;
  ph.innerHTML = `<summary><span class="etitle">Nützliche Wendungen</span><span class="edate">${u.wr.ph.length}</span></summary>
    <div class="ebody"><ul class="phrases">${u.wr.ph.map((p,i) => `<li><em>${i+1}</em><span>${esc(p)}</span></li>`).join("")}</ul></div>`;
  main.appendChild(ph);

  const ta = document.createElement("textarea");
  ta.rows = short ? 6 : 9;
  ta.placeholder = "Write in English …";
  ta.value = ses.text;
  main.appendChild(ta);

  const row = document.createElement("div");
  row.className = "meterrow";
  row.innerHTML = `<div class="meter"><i style="width:0"></i></div><span class="count"><strong>0</strong> / ${target} Wörter</span>`;
  main.appendChild(row);

  const bar = row.querySelector("i"), cnt = row.querySelector("strong");
  const upd = () => {
    ses.text = ta.value;
    const w = words(ta.value);
    cnt.textContent = w;
    bar.style.width = Math.min(100, (w / target) * 100) + "%";
  };
  ta.addEventListener("input", upd);
  upd();

  if(!short){
    const ch = document.createElement("div");
    ch.className = "card";
    ch.innerHTML = `<span class="label">Bevor du abschickst — kurz drüberlesen</span>
      <ul class="checks">${u.wr.ck.map(c => `<li>${esc(c)}</li>`).join("")}</ul>`;
    main.appendChild(ch);
  }

  dock.appendChild(btn("Fertig", "primary", () => { ses.text = ta.value; finishSession(); }));
}

/* ---------- DONE ---------- */
function renderDone(main, dock){
  const u = ses.u, short = ses.mode === "short";

  const hero = document.createElement("div");
  hero.className = "hero";
  hero.innerHTML = `
    <div class="stack tight">
      <span class="label accent">Geschafft</span>
      <h1>${esc(u.t)}</h1>
    </div>
    <div class="streakrow">
      ${short ? "" : `<div class="stat hot"><b>${ses.fixOk + ses.trOk}/${u.fix.length + u.tr.length}</b><span>Richtig</span></div>`}
      <div class="stat"><b>${ses.wcount}</b><span>Wörter</span></div>
      <div class="stat"><b>${mmss(ses.secs)}</b><span>Gebraucht</span></div>
    </div>
    ${short ? "" : `<p class="muted">Fehler gefunden: <strong>${ses.fixOk} von ${u.fix.length}</strong> · Übersetzt: <strong>${ses.trOk} von ${u.tr.length}</strong></p>`}`;
  main.appendChild(hero);

  if(ses.wcount > 0){
    const c = document.createElement("div");
    c.className = "card marked stack tight";
    c.innerHTML = `<span class="label">Dein Text</span>
      <p class="en" style="white-space:pre-wrap">${esc(ses.text.trim())}</p>`;
    main.appendChild(c);

    const n = document.createElement("div");
    n.className = "note";
    n.innerHTML = `<b>Korrektur holen:</b> Der Knopf unten kopiert deinen Text zusammen mit einer fertigen Anweisung. In die Claude-App einfügen, abschicken — du bekommst Korrektur, die drei wichtigsten Fehler und eine Regel für morgen. Dauert eine Minute.`;
    main.appendChild(n);

    dock.appendChild(btn("Für Claude kopieren", "primary", () => {
      copy(claudePrompt(u, short ? u.wr.short : u.wr.p, ses.text), "Kopiert — in Claude einfügen");
    }));
  }
  const b = btn(ses.wcount > 0 ? "Fertig" : "Zum Start", ses.wcount > 0 ? "ghost" : "primary", () => {
    ses = null; view = "home"; render(); window.scrollTo({top:0,behavior:"instant"});
  });
  if(ses.wcount > 0) b.style.flex = "0 0 auto";
  dock.appendChild(b);
}

/* ---------- SPRECHEN ---------- */
function renderSpeak(main, dock){
  const t = ses.topic, ph = ses.phase;

  const q = document.createElement("div");
  q.className = "card raised stack tight";
  q.innerHTML = `<span class="label accent">${esc(t.a)}</span><p class="en big">${esc(t.q)}</p>`;
  main.appendChild(q);

  if(ph === "ready"){
    const c = document.createElement("div");
    c.className = "card stack tight";
    c.innerHTML = `<span class="label">So läuft's</span>
      <p class="muted">30 Sekunden überlegen, dann <strong>zwei Minuten am Stück laut reden</strong> — so lang wie in der mündlichen Prüfung. Nichts aufschreiben, nur stichwortartig denken.</p>
      <p class="small">Allein im Zimmer reicht. Es geht darum, dass dein Mund die Sätze baut, nicht dein Kopf.</p>`;
    main.appendChild(c);
  }

  if(ph === "prep" || ph === "talk"){
    const c = document.createElement("div");
    c.className = "card";
    c.innerHTML = `<span class="timerlabel">${ph === "prep" ? "Überlegen" : "Reden — nicht aufhören"}</span>
      <span class="bigtimer ${ph === "prep" ? "prep" : ""}" id="bigTimer">${mmss(ses.left)}</span>
      <div class="ring ${ph === "prep" ? "prep" : ""}"><i id="ringFill"></i></div>`;
    main.appendChild(c);
  }

  if(ph !== "check"){
    const m = document.createElement("div");
    m.className = "card";
    m.innerHTML = `<span class="label">Das muss vorkommen</span>
      <ul class="checks">${t.must.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
    main.appendChild(m);

    const p = document.createElement("details");
    p.className = "entry";
    p.open = ph !== "talk";
    p.innerHTML = `<summary><span class="etitle">Wendungen aus deiner Wordlist</span><span class="edate">${ORAL_PHRASES.reduce((a,g)=>a+g.items.length,0)}</span></summary>
      <div class="ebody">${ORAL_PHRASES.map(g =>
        `<div class="phgroup"><b>${esc(g.g)}</b>${g.items.map(s => `<span>${esc(s)}</span>`).join("")}</div>`).join("")}</div>`;
    main.appendChild(p);
  }

  if(ph === "check"){
    const c = document.createElement("div");
    c.className = "card stack tight";
    c.innerHTML = `<span class="label right">Zeit um</span><p class="muted">Ehrlich abhaken — nur für dich.</p>`;
    main.appendChild(c);

    const labels = ["Ich habe die vollen zwei Minuten geredet","Ich habe mindestens drei der Wendungen benutzt","Ich habe Vor- und Nachteile genannt"];
    const box = document.createElement("div");
    box.className = "selfcheck";
    labels.forEach((lab, i) => {
      const b = document.createElement("button");
      b.className = ses.checks[i] ? "on" : "";
      b.innerHTML = `<span class="box">✓</span><span>${esc(lab)}</span>`;
      b.addEventListener("click", () => { ses.checks[i] = !ses.checks[i]; render(); });
      box.appendChild(b);
    });
    main.appendChild(box);

    const n = document.createElement("div");
    n.className = "note";
    n.innerHTML = `<b>Echte Prüfungsübung:</b> Der Knopf unten macht aus Claude einen Prüfer, der dir zu genau diesem Thema Rückfragen auf Englisch stellt. In der Claude-App die Spracheingabe nutzen — dann redest du wirklich.`;
    main.appendChild(n);
  }

  if(ph === "ready")      dock.appendChild(btn("30 Sekunden überlegen", "primary", () => runPhase("prep")));
  else if(ph === "prep")  dock.appendChild(btn("Ich rede jetzt", "primary", () => runPhase("talk")));
  else if(ph === "talk")  dock.appendChild(btn("Fertig", "primary", () => { stopSpeak(); ses.phase = "check"; render(); }));
  else {
    dock.appendChild(btn("Als Prüfer mit Claude", "primary", () => {
      copy(examinerPrompt(ses.topic), "Kopiert — in Claude einfügen");
    }));
    const b = btn("Fertig", "ghost", () => finishSpeak());
    b.style.flex = "0 0 auto";
    dock.appendChild(b);
  }
}

function examinerPrompt(t){
  return [
    "Du bist mein Prüfer in einer mündlichen Business-English-Prüfung (HTW Berlin, Modul M3W, Niveau B2.2). Ich bin Deutscher.",
    "",
    "Thema: " + t.q,
    "",
    "So läuft es ab:",
    "1) Stell mir die Frage oben auf Englisch und lass mich antworten.",
    "2) Danach stellst du mir drei bis vier Rückfragen auf Englisch — eine davon kritisch, sodass ich widersprechen muss.",
    "3) Bleib die ganze Zeit auf Englisch und antworte kurz, damit ich mehr rede als du.",
    "4) Erst ganz am Ende, wenn ich „Auswertung\" schreibe: gib mir auf Deutsch die drei wichtigsten Sprachfehler, eine Note von 1 bis 10 für B2.2-Niveau und den einen Punkt, an dem ich als Nächstes arbeiten soll.",
    "",
    "Fang jetzt direkt mit der Frage an, ohne Vorrede."
  ].join("\n");
}

/* ---------- TOPICS ---------- */
function renderTopics(main, dock){
  const next = pickNext();

  const intro = document.createElement("p");
  intro.className = "small";
  intro.textContent = "Tipp auf ein Thema, um direkt damit anzufangen. Die Zahl zeigt, wie gut es bisher sitzt.";
  main.appendChild(intro);

  const wrap = document.createElement("div");
  wrap.className = "topics";

  BLOCKS.forEach(bl => {
    const h = document.createElement("div");
    h.className = "blockhead";
    h.textContent = bl.name;
    wrap.appendChild(h);

    for(let i = bl.from - 1; i <= bl.to - 1 && i < UNITS.length; i++){
      const u = UNITS[i], s = strength(i);
      const pct = s === null ? null : Math.round(s * 100);
      const cls = pct === null ? "" : pct >= 80 ? "good" : pct >= 55 ? "mid" : "low";
      const b = document.createElement("button");
      b.className = "topic" + (i === next ? " cur" : "");
      b.innerHTML = `<span class="tt">${esc(u.t)}<small>${esc(u.g.split(/[.!?]/)[0])}.</small></span>` +
        `<span class="str ${cls}">${pct === null ? "neu" : pct + "%"}</span>`;
      b.addEventListener("click", () => startSession("full", i));
      wrap.appendChild(b);
    }
  });
  main.appendChild(wrap);

  if(S.stats.fixN + S.stats.trN > 0){
    const sum = document.createElement("p");
    sum.className = "small";
    sum.style.textAlign = "center";
    sum.textContent = "Insgesamt " + Math.round((S.stats.fixOk + S.stats.trOk) / (S.stats.fixN + S.stats.trN) * 100) +
      " % richtig · " + S.stats.words + " Wörter geschrieben";
    main.appendChild(sum);
  }

  const bk = btn("Fortschritt sichern oder zurückholen", "ghost", () => { view = "backup"; render(); });
  bk.style.minHeight = "42px";
  bk.style.fontSize = ".82rem";
  main.appendChild(bk);

  if(S.stats.rounds > 0){
    const reset = btn("Alles zurücksetzen", "ghost", () => {
      if(confirm("Wirklich alles löschen — Statistik und alle gespeicherten Texte?")){
        S = structuredClone(BLANK); save(); view = "home"; render();
      }
    });
    reset.style.minHeight = "40px";
    reset.style.fontSize = ".8rem";
    main.appendChild(reset);
  }

  dock.appendChild(btn("Zurück", "ghost", () => { view = "home"; render(); }));
}

/* ---------- ARCHIVE ---------- */
function renderArchive(main, dock){
  if(!S.texts.length){
    const c = document.createElement("div");
    c.className = "card";
    c.innerHTML = `<span class="label">Noch leer</span><p class="muted">Alles, was du im Schreibteil tippst, landet hier — nur auf diesem Gerät, nichts wird hochgeladen. Nach zwei Wochen siehst du hier, wie sich deine Sätze verändern.</p>`;
    main.appendChild(c);
  } else {
    const info = document.createElement("p");
    info.className = "small";
    info.textContent = S.texts.length + (S.texts.length === 1 ? " Text · " : " Texte · ") +
      S.texts.reduce((a,t) => a + t.w, 0) + " Wörter · gespeichert nur auf diesem Gerät";
    main.appendChild(info);

    S.texts.forEach((t, i) => {
      const d = document.createElement("details");
      d.className = "entry";
      d.innerHTML = `<summary><span class="etitle">${esc(t.u)}</span><span class="edate">${esc(t.d.slice(8,10) + "." + t.d.slice(5,7) + ".")} · ${t.w} W.</span></summary>
        <div class="ebody">
          <p class="eprompt">${esc(t.p)}</p>
          <div class="etext">${esc(t.x)}</div>
        </div>`;
      const b = btn("Für Claude kopieren", "ghost", () => {
        copy(claudePrompt({t:t.u}, t.p, t.x), "Kopiert — in Claude einfügen");
      });
      b.style.minHeight = "42px";
      d.querySelector(".ebody").appendChild(b);
      main.appendChild(d);
    });
  }

  dock.appendChild(btn("Zurück", "ghost", () => { view = "home"; render(); }));
  if(S.texts.length){
    dock.appendChild(btn("Alles kopieren", "", () => {
      copy(S.texts.map(t => `=== ${t.d} — ${t.u} ===\n${t.p}\n\n${t.x}`).join("\n\n\n"), "Alle Texte kopiert");
    }));
  }
}

/* ---------- SICHERUNG ----------
   Eine Datei überlebt das Löschen von Browserdaten — localStorage nicht.
   Deshalb ist der Datei-Weg hier der Hauptweg, Kopieren nur der Rückfall. */
function applyBackup(raw){
  let data = null;
  try{ data = JSON.parse(String(raw).trim()); }catch(e){}
  if(!data || typeof data !== "object" || !data.stats || typeof data.stats.rounds !== "number"){
    toast("Das ist keine gültige Sicherung"); return false;
  }
  const n = Array.isArray(data.texts) ? data.texts.length : 0;
  if(!confirm("Alles überschreiben und " + n + " gesicherte Texte einspielen?")) return false;
  S = Object.assign(structuredClone(BLANK), data, {
    stats: Object.assign(structuredClone(BLANK.stats), data.stats)
  });
  save(); toast("Wiederhergestellt"); view = "home"; render();
  return true;
}

function backupName(){
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return `daily-english-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}.json`;
}

function saveBackupFile(){
  const dl = window.claude && window.claude.downloads;
  if(!dl){ toast("Datei speichern geht hier nicht"); return; }
  dl.save({filename: backupName(), data: JSON.stringify(S)}).then(
    () => toast("Als Datei gespeichert"),
    err => {
      const c = err && err.code;
      if(c === "declined")           toast("Abgebrochen");
      else if(c === "rate_limited")  toast("Kurz warten, dann nochmal");
      else                           toast("Ging nicht — nimm „Text kopieren\"");
    }
  );
}

function renderBackup(main, dock){
  const canFile = !!(window.claude && window.claude.downloads);

  const a = document.createElement("div");
  a.className = "card stack tight";
  a.innerHTML = `<span class="label accent">Sichern</span>
    <p class="muted">Dein Fortschritt liegt im Browser. Wenn du Browserdaten löschst, ist er weg — <strong>eine gesicherte Datei nicht</strong>, die liegt in deinen Downloads.</p>
    <p class="small">Einmal im Monat reicht. Enthält Texte, Trefferquoten und Sprechrunden.</p>`;
  main.appendChild(a);

  if(canFile){
    const bf = btn("Als Datei speichern", "primary", saveBackupFile);
    bf.style.minHeight = "46px";
    main.appendChild(bf);
  }
  const bc = btn(canFile ? "Stattdessen Text kopieren" : "Sicherung kopieren", "", () => copy(JSON.stringify(S), "Sicherung kopiert"));
  bc.style.minHeight = "44px";
  main.appendChild(bc);

  const b = document.createElement("div");
  b.className = "card stack tight";
  b.innerHTML = `<span class="label wrong">Zurückholen</span>
    <p class="muted">Überschreibt alles, was gerade gespeichert ist.</p>`;
  main.appendChild(b);

  const file = document.createElement("input");
  file.type = "file";
  file.accept = ".json,application/json";
  file.style.display = "none";
  file.addEventListener("change", () => {
    const f = file.files && file.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = () => applyBackup(r.result);
    r.onerror = () => toast("Datei ließ sich nicht lesen");
    r.readAsText(f);
    file.value = "";
  });
  main.appendChild(file);

  const bfile = btn("Sicherungsdatei wählen", "primary", () => file.click());
  bfile.style.minHeight = "46px";
  main.appendChild(bfile);

  const inp = document.createElement("textarea");
  inp.className = "copybox"; inp.rows = 4;
  inp.placeholder = "… oder gesicherten Text hier einfügen";
  main.appendChild(inp);

  const b2 = btn("Aus Text wiederherstellen", "", () => applyBackup(inp.value));
  b2.style.minHeight = "44px";
  main.appendChild(b2);

  dock.appendChild(btn("Zurück", "ghost", () => { view = "topics"; render(); }));
}

/* ---------- MANUAL COPY ---------- */
function renderManual(main, dock){
  const c = document.createElement("div");
  c.className = "card stack tight";
  c.innerHTML = `<span class="label">Automatisches Kopieren ging nicht</span>
    <p class="muted">Text antippen, alles markieren, kopieren — dann in Claude einfügen.</p>`;
  main.appendChild(c);
  const ta = document.createElement("textarea");
  ta.className = "copybox";
  ta.rows = 14;
  ta.value = manualText;
  ta.readOnly = true;
  ta.addEventListener("focus", () => ta.select());
  main.appendChild(ta);
  dock.appendChild(btn("Zurück", "ghost", () => { view = ses ? "done" : "home"; render(); }));
}

  stopClock(); stopSpeak(); ses = null; view = "home"; render();
